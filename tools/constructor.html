<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор этапов — where-is-the-truth</title>
<style>
  :root {
    --bg: #1c1d21;
    --card-bg: #2a2b30;
    --field-bg: #212226;
    --border: #3d3e44;
    --surface-2: #35363c;
    --surface-3: #40414a;
    --text: #e8e9ec;
    --muted: #9a9ba5;
    --accent: #35867e;
    --danger: #f36a6a;
    --danger-bg: #3a2225;
    --danger-border: #5a2f2f;
    --success: #4ade80;
    --hint-bg: #23263d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    height: 53px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0 16px 0 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  header button {
    padding: 6px 14px;
    font-size: 14px;
    line-height: 18px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cube-mark {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
  }
  button:hover { background: var(--surface-3); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #btnSave {
    background: #3fe0cc;
    color: #062521;
    font-weight: 600;
  }
  #btnSave:hover:not(:disabled) { background: #6ae8d8; }
  #status.dirty { color: #f59e0b; }
  #status.saved { color: var(--success); }
  .tabs {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 500;
  }
  .tab-btn:hover {
    background: var(--surface-3);
    color: var(--text);
  }
  .tab-btn.active {
    color: #fff;
  }
  .tab-backdrop {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .layout {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin: 24px 0 80px;
    padding: 0 16px;
  }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sidebar:has(#storagePanel:empty) { display: none; }
  .scenario-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 30px;
    margin-bottom: 14px;
  }
  /* Level with the stages list: skip the toolbar row (30px + 14px gap) that sits above it. */
  #tabPanelScenarios .sidebar { margin-top: 44px; }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    #tabPanelScenarios .sidebar { margin-top: 0; }
  }
  main {
    flex: 1;
    min-width: 0;
    max-width: 760px;
  }
  .hero-banner {
    position: relative;
    overflow: hidden;
    background: #08080a;
    user-select: none;
    touch-action: none;
  }
  .hero-canvas {
    position: absolute;
    inset: 0;
    display: block;
  }
  .hero-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.72) 100%);
  }
  .hero-cta {
    position: absolute;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%);
    padding: 0 0 7px;
    border: none;
    border-bottom: 2px solid #f6f6f8;
    border-radius: 0;
    background: transparent;
    color: #f6f6f8;
    font: 600 13px/1 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
  }
  .hero-cta:hover { background: transparent; opacity: 0.75; }
  .error.hero-error {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 520px;
    margin: 0;
  }
  .scenarios-panel:empty { display: none; }
  .storage-box {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
  }
  .storage-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 12px;
  }
  .storage-head svg { width: 20px; height: 20px; flex-shrink: 0; color: #3fe0cc; }
  .storage-title { font-weight: 600; }
  .storage-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .storage-tabs {
    display: flex;
    gap: 4px;
    margin: 0 14px 10px;
    padding: 3px;
    border-radius: 10px;
    background: var(--field-bg);
  }
  .storage-tabs button {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
  }
  .storage-tabs button:hover { background: var(--surface-2); color: var(--text); }
  .storage-tabs button.active { background: var(--surface-3); color: #fff; }
  .storage-count {
    min-width: 18px;
    padding: 0 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    font-size: 11px;
    line-height: 16px;
  }
  .storage-tabs button.active .storage-count { background: var(--accent); }
  .storage-note { padding: 0 14px 12px; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .storage-box .scenarios-list {
    max-height: calc(100vh - 290px);
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .scenarios-list {
    display: flex;
    flex-direction: column;
  }
  .scenario-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  .scenario-row:first-child { border-top: none; }
  .scenario-row-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .scenario-name {
    flex: 1;
    min-width: 0;
    white-space: normal;
    word-break: break-word;
  }
  .scenario-row-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .scenarios-empty {
    padding: 16px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  .design-sections {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
  }
  .design-section-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border: none;
    border-top: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
  }
  .design-section-item:first-child { border-top: none; }
  .design-section-item.active {
    background: var(--accent);
    color: #fff;
  }
  .design-block {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .design-block-title {
    margin: 0;
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .design-slot {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 16px;
  }
  .design-slot + .design-slot { border-top: 1px solid var(--border); }
  .design-slot-label {
    flex: 1;
    min-width: 160px;
    font-size: 14px;
    font-weight: 500;
  }
  .design-slot-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sound-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    min-width: 116px;
  }
  .sound-status::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .sound-status.ready { color: var(--text); }
  .sound-status.ready::before { background: #3fe0cc; box-shadow: 0 0 6px rgba(63,224,204,0.8); }
  .bg-thumb {
    width: 128px;
    height: 72px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0c0c0e center / contain no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }
  .bg-thumb.empty { border-style: dashed; }
  .font-preview { min-width: 220px; }
  .font-name { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .font-sample { font-size: 22px; color: var(--text); line-height: 1.2; }
  .font-sample.missing { font-size: 13px; color: var(--muted); }
  .kind-toggle.score-presets { margin-bottom: 0; }
  .score-input[type="text"] { width: 110px; }
  .field-error { font-size: 12px; color: var(--danger); }
  .field-error:empty { display: none; }
  .stage-word-field { display: flex; flex-direction: column; gap: 4px; width: 220px; }
  .field-hint { font-size: 12px; color: var(--muted); }
  .switch {
    appearance: none;
    position: relative;
    width: 36px;
    height: 20px;
    margin: 0;
    flex-shrink: 0;
    border-radius: 999px;
    background: var(--surface-3);
    cursor: pointer;
    transition: background .15s;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .15s, background .15s;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(16px); background: #fff; }
  .flow-row { background: var(--card-bg); }
  .flow-row + .flow-row { border-top: 1px solid var(--border); }
  .flow-row-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
  }
  .flow-row-head .drag-handle { width: 26px; text-align: center; flex-shrink: 0; }
  .flow-row-label { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
  .flow-row.off .flow-row-label { color: var(--muted); }
  .flow-note { font-size: 12px; color: var(--muted); }
  .flow-stage-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 16px 14px 52px;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
  }
  .flow-stage-item {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    min-height: 26px;
    font-size: 13px;
  }
  .flow-stage-item-label { flex: 1; min-width: 140px; }
  .flow-stage-item .kind-toggle { margin-bottom: 0; }
  .team-names-fields { display: flex; gap: 14px; flex-wrap: wrap; padding: 14px 16px; }
  .team-names-fields > div { flex: 1; min-width: 160px; }
  .flow-chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 14px 16px;
  }
  .flow-pill {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 12px;
    white-space: nowrap;
  }
  .flow-pill.stage { background: var(--accent); color: #fff; }
  .flow-arrow { font-size: 12px; color: var(--muted); }
  .error {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .round-list {
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .round-card {
    background: var(--card-bg);
  }
  .round-card + .round-card { border-top: 1px solid var(--border); }
  .round-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .drag-handle {
    cursor: grab;
    color: var(--muted);
    font-size: 18px;
    padding: 2px 4px;
    user-select: none;
    touch-action: none;
    transition: color .15s, text-shadow .15s;
  }
  .drag-handle:hover { color: #3fe0cc; text-shadow: 0 0 8px rgba(63,224,204,0.7); }
  .round-num {
    color: var(--muted);
    font-size: 13px;
    min-width: 20px;
  }
  .round-name {
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .round-actions {
    display: flex;
    gap: 6px;
    margin-right: 10px;
    opacity: 0;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  .round-head:hover .round-actions { opacity: 1; }
  /* Glass tile, like a cube face: quiet at rest, lights up in its hue on hover like a balloon. */
  .glass-btn {
    --glow: 63,224,204;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: background .18s, border-color .18s, color .18s, box-shadow .18s, transform .18s;
  }
  .glass-btn.danger { --glow: 255,124,156; }
  .glass-btn:hover:not(:disabled) {
    background: rgba(var(--glow),0.18);
    border-color: rgba(var(--glow),0.55);
    color: #fff;
    transform: translateY(-1px) scale(1.06);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      0 0 14px rgba(var(--glow),0.45),
      -1px 0 0 rgba(255,70,80,0.35),
      1px 0 0 rgba(70,200,255,0.35);
  }
  .glass-btn.playing {
    background: rgba(var(--glow),0.18);
    border-color: rgba(var(--glow),0.55);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 14px rgba(var(--glow),0.45);
  }
  .glass-btn:active:not(:disabled) { transform: scale(0.96); }
  .glass-btn svg { width: 17px; height: 17px; }
  .glass-btn.compact { width: 24px; height: 24px; border-radius: 7px; }
  .glass-btn.compact svg { width: 14px; height: 14px; }
  .glass-tip {
    position: fixed;
    z-index: 100;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    color: var(--text);
    background: rgba(20,21,24,0.92);
    border: 1px solid rgba(var(--glow),0.45);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 4px);
    transition: opacity .15s, transform .15s;
  }
  .glass-tip.visible { opacity: 1; transform: translate(-50%, 0); }
  .chevron {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--muted);
    transition: transform .15s;
  }
  .chevron svg { width: 18px; height: 18px; stroke-width: 2.2; }
  .round-card.expanded .chevron { transform: rotate(90deg); }
  .round-body {
    border-top: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  input[type="text"], input[type="number"], select, textarea {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--field-bg);
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .field-row > div { flex: 1; min-width: 160px; }
  .questions-list { display: flex; flex-direction: column; gap: 10px; }
  .question-row {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .question-main { flex: 1; min-width: 0; }
  .kind-toggle {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .kind-toggle button {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 999px;
  }
  .kind-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .image-drop {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .image-drop:hover { border-color: var(--accent); background: var(--hint-bg); }
  .image-preview {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .image-preview img {
    max-width: 110px;
    max-height: 70px;
    border-radius: 6px;
    border: 1px solid var(--border);
    object-fit: contain;
    background: var(--bg);
  }
  .image-preview .path {
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .row-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-round-btn {
    width: 100%;
    padding: 12px;
    border-style: dashed;
    border-color: var(--border);
    color: var(--muted);
  }
  .add-round-controls {
    display: flex;
    gap: 10px;
  }
  .add-round-controls > .add-round-btn,
  .add-round-controls > .add-from-buffer-wrap {
    flex: 1;
  }
  .add-from-buffer-wrap {
    position: relative;
  }
  .buffer-dropdown {
    position: absolute;
    bottom: 0;
    left: calc(100% + 6px);
    min-width: 240px;
    max-width: 320px;
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    text-align: left;
  }
  .buffer-dropdown-empty {
    padding: 12px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  .buffer-dropdown-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .buffer-dropdown-row:first-child { border-top: none; }
  .buffer-dropdown-row:hover { background: var(--surface-3); }
  .buffer-dropdown-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  body.sorting, body.sorting * { cursor: grabbing !important; user-select: none; }
  .sort-placeholder {
    background-image: linear-gradient(rgba(63,224,204,0.06), rgba(63,224,204,0.06));
    outline: 1px dashed rgba(63,224,204,0.6);
    outline-offset: -4px;
  }
  .sort-placeholder > * { visibility: hidden; }
  .sort-ghost {
    position: fixed;
    z-index: 60;
    margin: 0;
    pointer-events: none;
    background: var(--card-bg);
    border: 1px solid rgba(63,224,204,0.55);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 14px 30px rgba(0,0,0,0.5), 0 0 18px rgba(63,224,204,0.35);
  }
  .sort-ghost .drag-handle { color: #3fe0cc; }
  .sort-landed { animation: sort-land .9s ease-out; }
  @keyframes sort-land {
    from { box-shadow: inset 0 0 0 1px rgba(63,224,204,0.85), inset 0 0 0 999px rgba(63,224,204,0.12); }
    to { box-shadow: inset 0 0 0 1px rgba(63,224,204,0), inset 0 0 0 999px rgba(63,224,204,0); }
  }
</style>
</head>
<body>
<header>
  <h1><svg class="cube-mark" viewBox="0 0 20 20" aria-hidden="true">
    <polygon points="10,0 19,5 10,10 1,5" fill="#fff3d6"/>
    <polygon points="1,5 10,10 10,20 1,15" fill="#ffc85a"/>
    <polygon points="10,10 19,5 19,15 10,20" fill="#c77f10"/>
  </svg>Конструктор</h1>
  <nav id="tabs" class="tabs" style="display:none">
    <button class="tab-btn" data-tab="scenarios">Сценарии</button>
    <button class="tab-btn" data-tab="design">Настройки</button>
  </nav>
  <span id="status"></span>
  <button id="btnSave" disabled style="display:none">Сохранить</button>
</header>
<div id="heroBanner" class="hero-banner">
  <canvas id="heroCanvas" class="hero-canvas" role="img" aria-label="Конструктор"></canvas>
  <div class="hero-vignette"></div>
  <div id="heroError" class="error hero-error" style="display:none"></div>
  <button id="initialHint" class="hero-cta" type="button">Открой папку проекта</button>
</div>
<canvas id="tabBackdrop" class="tab-backdrop" aria-hidden="true" style="display:none"></canvas>
<div id="tabPanelDesign" class="layout" style="display:none">
  <aside class="sidebar">
    <div id="designSectionsList" class="design-sections"></div>
  </aside>
  <main id="designSectionContent"></main>
</div>
<div id="tabPanelScenarios" class="layout" style="display:none">
  <aside class="sidebar">
    <div id="storagePanel" class="scenarios-panel"></div>
  </aside>
  <main id="app"></main>
</div>

<script>
'use strict';

const RoundType = {
  Question: 'Question',
  QuestionWithTimer: 'Question with timer',
  Timer: 'Timer',
};

const state = {
  pendingHandle: null, // remembered folder handle awaiting a user gesture to re-request permission
  imagesHandle: null,
  roundsHandle: null,
  rounds: null,
  expanded: new Set(),
  dirty: false,
  scenariosHandle: null,
  scenarios: [], // ordered list of scenario names (without .json)
  stageBufferHandle: null,
  stageBuffer: [], // sorted list of saved single-round template names (without .json)
  storageTab: 'scenarios', // which list the storage shows: 'scenarios' or 'stages'
  audioHandle: null,
  backgroundHandle: null,
  fontsHandle: null,
  settingsHandle: null,
  settings: null, // contents of src/assets/settings.json
};

const app = document.getElementById('app');
const storagePanel = document.getElementById('storagePanel');
const statusEl = document.getElementById('status');
const btnSave = document.getElementById('btnSave');
const initialHint = document.getElementById('initialHint');
const tabsBar = document.getElementById('tabs');
const tabButtons = tabsBar.querySelectorAll('.tab-btn');
const layoutEl = document.getElementById('tabPanelScenarios');
const designPanel = document.getElementById('tabPanelDesign');
const designSectionsList = document.getElementById('designSectionsList');
const designSectionContent = document.getElementById('designSectionContent');
const heroBanner = document.getElementById('heroBanner');
const heroError = document.getElementById('heroError');
const tabBackdrop = document.getElementById('tabBackdrop');

function setActiveTab(tab) {
  tabButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === tab));
  layoutEl.style.display = tab === 'scenarios' ? '' : 'none';
  designPanel.style.display = tab === 'design' ? '' : 'none';
  heroBanner.style.display = tab ? 'none' : '';
  tabBackdrop.style.display = tab ? '' : 'none';
  if (tab === 'design' && !activeDesignSection) {
    setActiveDesignSection(DESIGN_SECTIONS[0].id);
  } else if (tab === 'design' && activeDesignSection === 'flow') {
    // The slide chain depends on how many stages the current game has, which the other tab may have changed.
    refreshDesign();
  }
}

tabButtons.forEach((btn) => {
  btn.onclick = () => setActiveTab(btn.dataset.tab);
});

// ---------- Design tab: sections list ----------
const DESIGN_SECTIONS = [
  { id: 'general', label: 'Дизайн', render: renderGeneralSection },
  { id: 'flow', label: 'Конструктор игры', render: renderFlowSection },
];
let activeDesignSection = null;
let designObjectUrls = [];

function renderDesignSectionsList() {
  designSectionsList.innerHTML = '';
  DESIGN_SECTIONS.forEach((section) => {
    const btn = document.createElement('button');
    btn.className = 'design-section-item' + (section.id === activeDesignSection ? ' active' : '');
    btn.textContent = section.label;
    btn.onclick = () => setActiveDesignSection(section.id);
    designSectionsList.appendChild(btn);
  });
}

function setActiveDesignSection(id) {
  activeDesignSection = id;
  renderDesignSectionsList();
  const section = DESIGN_SECTIONS.find((s) => s.id === id);
  stopSoundPreview();
  designObjectUrls.forEach((url) => URL.revokeObjectURL(url));
  designObjectUrls = [];
  designSectionContent.innerHTML = '';
  if (section) section.render(designSectionContent);
}

function refreshDesign() {
  if (activeDesignSection) setActiveDesignSection(activeDesignSection);
}

function designObjectUrl(file) {
  const url = URL.createObjectURL(file);
  designObjectUrls.push(url);
  return url;
}

// ---------- Settings tab: "Дизайн" — one visually separate block per topic ----------
function renderGeneralSection(container) {
  container.appendChild(renderDesignBlock('Фоны', (block) => {
    BACKGROUND_SLOTS.forEach((slot) => block.appendChild(renderBackgroundSlot(slot)));
  }));
  container.appendChild(renderDesignBlock('Шрифты', (block) => block.appendChild(renderFontSlot())));
  container.appendChild(renderDesignBlock('Звуки', (block) => {
    SOUND_SLOTS.forEach((slot) => block.appendChild(renderSoundSlot(slot)));
  }));
  container.appendChild(renderDesignBlock('Детали', (block) => {
    block.appendChild(renderScoringSlot());
    block.appendChild(renderStageWordSlot());
  }));
}

function renderDesignBlock(title, fill) {
  const block = document.createElement('section');
  block.className = 'design-block';
  const heading = document.createElement('h2');
  heading.className = 'design-block-title';
  heading.textContent = title;
  block.appendChild(heading);
  fill(block);
  return block;
}

function renderDesignSlot(labelText) {
  const row = document.createElement('div');
  row.className = 'design-slot';
  const label = document.createElement('span');
  label.className = 'design-slot-label';
  label.textContent = labelText;
  row.appendChild(label);
  const controls = document.createElement('div');
  controls.className = 'design-slot-controls';
  row.appendChild(controls);
  return { row, controls };
}

// Returns setPresent(bool): with no file the pick button reads "Добавить" and there is nothing to delete.
function addReplaceDeleteButtons(controls, onPick, onDelete, deleteTitle) {
  const pickBtn = createIconBtn(ICON_PLUS, 'Добавить');
  pickBtn.onclick = onPick;
  controls.appendChild(pickBtn);
  const deleteBtn = createIconBtn(ICON_TRASH, deleteTitle, true);
  deleteBtn.onclick = onDelete;
  controls.appendChild(deleteBtn);
  return (present) => {
    const tip = present ? 'Заменить' : 'Добавить';
    pickBtn.innerHTML = present ? ICON_REPLACE : ICON_PLUS;
    pickBtn.dataset.tip = tip;
    pickBtn.setAttribute('aria-label', tip);
    deleteBtn.disabled = !present;
  };
}

async function readDesignFile(dirHandle, fileName) {
  const fh = await dirHandle.getFileHandle(fileName);
  return fh.getFile();
}

async function writeFileHandle(fileHandle, data) {
  const writable = await fileHandle.createWritable();
  await writable.write(data);
  await writable.close();
}

async function writeDesignFile(dirHandle, fileName, data) {
  await writeFileHandle(await dirHandle.getFileHandle(fileName, { create: true }), data);
}

async function pickOneFile(pickerId, description, accept) {
  if (!window.showOpenFilePicker) {
    setStatus('Этот браузер не поддерживает выбор файла таким способом.', 'dirty');
    return null;
  }
  try {
    const [handle] = await window.showOpenFilePicker({ id: pickerId, multiple: false, types: [{ description, accept }] });
    return await handle.getFile();
  } catch (e) {
    return null; // user cancelled the dialog
  }
}

async function removeDesignFile(dirHandle, fileName, confirmText, doneText) {
  if (!confirm(confirmText)) return false;
  try {
    await dirHandle.removeEntry(fileName);
    setStatus(doneText, 'saved');
  } catch (e) {
    if (e.name !== 'NotFoundError') {
      setStatus('Не удалось удалить файл: ' + e.message, 'dirty');
      return false;
    }
  }
  return true;
}

// ---------- Design: backgrounds (fixed file names the game's styles point at) ----------
const BACKGROUND_SLOTS = [
  { id: 'welcome.jpg', label: 'Начальный фон' },
  { id: 'round.jpg', label: 'Фон названия раунда' },
  { id: 'first-team.jpg', label: 'Фон левой команды' },
  { id: 'second-team.jpg', label: 'Фон правой команды' },
  { id: 'end.jpg', label: 'Финальный фон' },
];

function renderBackgroundSlot(slot) {
  const { row, controls } = renderDesignSlot(slot.label);
  const thumb = document.createElement('div');
  thumb.className = 'bg-thumb';
  controls.appendChild(thumb);
  const setPresent = addReplaceDeleteButtons(controls, () => pickBackgroundFile(slot), () => deleteBackgroundFile(slot), 'Удалить фон');
  setPresent(false);
  readDesignFile(state.backgroundHandle, slot.id)
    .then((file) => {
      thumb.style.backgroundImage = 'url("' + designObjectUrl(file) + '")';
      setPresent(true);
    })
    .catch(() => {
      thumb.classList.add('empty');
      thumb.textContent = 'Фон не выбран';
    });
  return row;
}

async function pickBackgroundFile(slot) {
  const file = await pickOneFile('design-backgrounds', 'Картинка (JPG, PNG, WebP)', {
    'image/jpeg': ['.jpg', '.jpeg'],
    'image/png': ['.png'],
    'image/webp': ['.webp'],
  });
  if (!file) return;
  try {
    const isJpeg = file.type === 'image/jpeg' || /\.jpe?g$/i.test(file.name);
    const data = isJpeg ? await file.arrayBuffer() : await convertImageToJpeg(file);
    await writeDesignFile(state.backgroundHandle, slot.id, data);
    setStatus('Фон «' + slot.label + '» обновлён', 'saved');
  } catch (e) {
    setStatus('Не удалось сохранить фон: ' + e.message, 'dirty');
  }
  refreshDesign();
}

// The game's styles reference .jpg files, so PNG/WebP are re-encoded; transparency becomes black like the game's backdrop.
async function convertImageToJpeg(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close();
  const blob = await new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('картинку не удалось перевести в JPG'))), 'image/jpeg', 0.92);
  });
  return blob.arrayBuffer();
}

async function deleteBackgroundFile(slot) {
  const removed = await removeDesignFile(
    state.backgroundHandle, slot.id,
    'Удалить «' + slot.label + '»? В игре на этом месте будет пустой фон.',
    'Фон «' + slot.label + '» удалён',
  );
  if (removed) refreshDesign();
}

// ---------- Design: game font (one file the game's global styles load) ----------
const FONT_FILE = 'game-font.ttf';
let fontPreviewFace = null;
let fontPreviewCounter = 0;

function renderFontSlot() {
  const { row, controls } = renderDesignSlot('Шрифт игры');
  const preview = document.createElement('div');
  preview.className = 'font-preview';
  const name = document.createElement('div');
  name.className = 'font-name';
  const sample = document.createElement('div');
  sample.className = 'font-sample';
  preview.appendChild(name);
  preview.appendChild(sample);
  controls.appendChild(preview);
  const setPresent = addReplaceDeleteButtons(controls, pickFontFile, deleteFontFile, 'Удалить шрифт');
  setPresent(false);

  readDesignFile(state.fontsHandle, FONT_FILE)
    .then(async (file) => {
      setPresent(true);
      const family = await loadFontPreview(await file.arrayBuffer());
      name.textContent = state.settings.fontName || 'Без названия';
      sample.style.fontFamily = '"' + family + '"';
      sample.textContent = 'Конструктор АБВ abc 0123';
    })
    .catch(() => {
      sample.classList.add('missing');
      sample.textContent = 'Шрифт не выбран — в игре будет стандартный шрифт';
    });

  return row;
}

// Each preview gets a fresh family name so the browser never shows a stale cached face.
async function loadFontPreview(data) {
  const family = 'DesignFontPreview' + (++fontPreviewCounter);
  const face = new FontFace(family, data);
  await face.load();
  if (fontPreviewFace) document.fonts.delete(fontPreviewFace);
  document.fonts.add(face);
  fontPreviewFace = face;
  return family;
}

async function pickFontFile() {
  const file = await pickOneFile('design-fonts', 'Шрифт (TTF, OTF)', {
    'font/ttf': ['.ttf'],
    'font/otf': ['.otf'],
  });
  if (!file) return;
  try {
    const data = await file.arrayBuffer();
    try {
      await new FontFace('DesignFontCheck', data).load();
    } catch (e) {
      setStatus('Этот файл не похож на шрифт — выбери файл .ttf или .otf', 'dirty');
      return;
    }
    await writeDesignFile(state.fontsHandle, FONT_FILE, data);
    state.settings.fontName = file.name.replace(/\.[^.]+$/, '');
    await saveSettings();
    setStatus('Шрифт «' + state.settings.fontName + '» установлен', 'saved');
  } catch (e) {
    setStatus('Не удалось сохранить шрифт: ' + e.message, 'dirty');
  }
  refreshDesign();
}

async function deleteFontFile() {
  const removed = await removeDesignFile(
    state.fontsHandle, FONT_FILE,
    'Удалить шрифт игры? В игре будет использоваться стандартный шрифт.',
    'Шрифт удалён',
  );
  if (!removed) return;
  state.settings.fontName = '';
  try {
    await saveSettings();
  } catch (e) {
    setStatus('Не удалось обновить настройки: ' + e.message, 'dirty');
  }
  refreshDesign();
}

// ---------- Design: points per correct answer ----------
const SCORE_PRESETS = [10, 50, 100];

function renderScoringSlot() {
  const { row, controls } = renderDesignSlot('Баллы за правильный ответ');

  const presets = document.createElement('div');
  presets.className = 'kind-toggle score-presets';
  const presetButtons = SCORE_PRESETS.map((value) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = String(value);
    btn.onclick = () => {
      input.value = String(value);
      applyScore();
    };
    presets.appendChild(btn);
    return { value, btn };
  });
  controls.appendChild(presets);

  // A plain text field keeps typing by hand but drops the number spinner (and its wheel/arrow nudges).
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'numeric';
  input.maxLength = 7;
  input.className = 'score-input';
  input.value = String(state.settings.scorePoints);
  input.setAttribute('aria-label', 'Своё количество баллов');
  controls.appendChild(input);

  const error = document.createElement('span');
  error.className = 'field-error';
  controls.appendChild(error);

  const markActive = () => {
    presetButtons.forEach(({ value, btn }) => btn.classList.toggle('active', value === state.settings.scorePoints));
  };

  const applyScore = async () => {
    const value = Number(input.value);
    if (input.value.trim() === '' || !Number.isInteger(value) || value < 1) {
      error.textContent = 'Введи целое число больше нуля';
      return;
    }
    error.textContent = '';
    input.value = String(value);
    if (value === state.settings.scorePoints) return;
    const previous = state.settings.scorePoints;
    state.settings.scorePoints = value;
    try {
      await saveSettings();
      setStatus('Баллы за ответ: ' + value + ' — сохранено', 'saved');
    } catch (e) {
      state.settings.scorePoints = previous;
      input.value = String(previous);
      setStatus('Не удалось сохранить баллы: ' + e.message, 'dirty');
    }
    markActive();
  };

  input.addEventListener('input', () => {
    const digits = input.value.replace(/\D/g, '');
    if (digits !== input.value) input.value = digits;
    error.textContent = '';
  });
  input.addEventListener('change', applyScore);
  markActive();
  return row;
}

// ---------- The stage word in every case the Constructor's texts need ----------
// Russian endings by rule, not a dictionary: common words (этап, раунд, тур, матч, игра, партия, задание, часть)
// come out right; words with a dropping vowel (уровень → уровня) may not. Only the first word is declined,
// so "Тур викторины" becomes "тура викторины".
function declineStageWord(raw) {
  const [head, ...rest] = String(raw || 'Этап').trim().split(/\s+/);
  const tail = rest.length ? ' ' + rest.join(' ') : '';
  const w = head.toLowerCase();
  const stem = w.slice(0, -1);
  const hushing = /[жшчщц]$/;
  const velarOrHushing = /[кгхжшчщ]$/;
  let f;
  if (w.endsWith('ие')) {
    f = { gender: 'n', gen: stem + 'я', acc: w, ins: stem + 'ем', pl: stem + 'я', genPl: stem + 'й' };
  } else if (w.endsWith('о')) {
    f = { gender: 'n', gen: stem + 'а', acc: w, ins: stem + 'ом', pl: stem + 'а', genPl: stem };
  } else if (w.endsWith('е')) {
    f = { gender: 'n', gen: stem + 'я', acc: w, ins: stem + 'ем', pl: stem + 'я', genPl: stem + 'ей' };
  } else if (w.endsWith('ия')) {
    f = { gender: 'f', gen: stem + 'и', acc: stem + 'ю', ins: stem + 'ей', pl: stem + 'и', genPl: stem + 'й' };
  } else if (w.endsWith('я')) {
    f = { gender: 'f', gen: stem + 'и', acc: stem + 'ю', ins: stem + 'ей', pl: stem + 'и', genPl: stem + 'ь' };
  } else if (w.endsWith('а')) {
    const soft = velarOrHushing.test(stem);
    f = {
      gender: 'f', gen: stem + (soft ? 'и' : 'ы'), acc: stem + 'у', ins: stem + (hushing.test(stem) ? 'ей' : 'ой'),
      pl: stem + (soft ? 'и' : 'ы'), genPl: stem,
    };
  } else if (w.endsWith('й')) {
    f = { gender: 'm', gen: stem + 'я', acc: w, ins: stem + 'ем', pl: stem + 'и', genPl: stem + 'ев' };
  } else if (/(сть|[жшчщ]ь)$/.test(w)) {
    f = { gender: 'f', gen: stem + 'и', acc: w, ins: w + 'ю', pl: stem + 'и', genPl: stem + 'ей' };
  } else if (w.endsWith('ь')) {
    f = { gender: 'm', gen: stem + 'я', acc: w, ins: stem + 'ем', pl: stem + 'и', genPl: stem + 'ей' };
  } else {
    f = {
      gender: 'm', gen: w + 'а', acc: w, ins: w + (hushing.test(w) ? 'ем' : 'ом'),
      pl: w + (velarOrHushing.test(w) ? 'и' : 'ы'), genPl: w + (/[жшчщ]$/.test(w) ? 'ей' : 'ов'),
    };
  }
  const forms = { nom: w, ...f };
  Object.keys(forms).forEach((key) => { if (key !== 'gender') forms[key] += tail; });
  return forms;
}

// W.gen → "раунда", W.Gen → "Раунда"; W.pick('Новый', 'Новая', 'Новое') agrees a word with the stage word's gender.
const W = {};
function refreshStageWord() {
  const forms = declineStageWord(state.settings && state.settings.stageWord);
  Object.keys(forms).forEach((key) => {
    W[key] = forms[key];
    if (key !== 'gender') W[key[0].toUpperCase() + key.slice(1)] = forms[key][0].toUpperCase() + forms[key].slice(1);
  });
  W.pick = (m, f, n) => ({ m, f, n })[forms.gender];
  document.title = 'Конструктор ' + W.genPl + ' — where-is-the-truth';
}
refreshStageWord();

// ---------- Design: the word the game shows before each round number ----------
function renderStageWordSlot() {
  const { row, controls } = renderDesignSlot('Имя соревнований');

  const field = document.createElement('div');
  field.className = 'stage-word-field';
  const input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 40;
  input.value = state.settings.stageWord;
  input.setAttribute('aria-label', 'Имя соревнований');
  const hint = document.createElement('div');
  hint.className = 'field-hint';
  const error = document.createElement('div');
  error.className = 'field-error';
  field.appendChild(input);
  field.appendChild(hint);
  field.appendChild(error);
  controls.appendChild(field);

  const showHint = () => {
    const word = input.value.trim();
    hint.textContent = word ? 'В игре: «' + word + ' 1»' : '';
  };

  const applyWord = async () => {
    const word = input.value.trim();
    if (!word) {
      error.textContent = 'Введи слово — например, «Этап» или «Раунд»';
      return;
    }
    error.textContent = '';
    input.value = word;
    if (word === state.settings.stageWord) return;
    const previous = state.settings.stageWord;
    state.settings.stageWord = word;
    try {
      await saveSettings();
      setStatus('Имя соревнований «' + word + '» — сохранено', 'saved');
      // Every text in the Constructor that names a stage follows the new word.
      refreshStageWord();
      render();
      renderStorage();
    } catch (e) {
      state.settings.stageWord = previous;
      input.value = previous;
      showHint();
      setStatus('Не удалось сохранить имя соревнований: ' + e.message, 'dirty');
    }
  };

  input.addEventListener('input', () => {
    error.textContent = '';
    showHint();
  });
  input.addEventListener('change', applyWord);
  showHint();
  return row;
}

// ---------- Design: settings.json (read by the game at build time) ----------
const DEFAULT_SETTINGS = { scorePoints: 100, fontName: '', stageWord: 'Этап', gameFlow: null, teamNames: null };

async function loadSettings(handle) {
  let parsed = null;
  try {
    const text = await (await handle.getFile()).text();
    if (text.trim()) parsed = JSON.parse(text);
  } catch (e) {
    parsed = null;
  }
  const settings = { ...DEFAULT_SETTINGS, ...(parsed && typeof parsed === 'object' ? parsed : {}) };
  if (typeof settings.stageWord !== 'string' || !settings.stageWord.trim()) settings.stageWord = DEFAULT_SETTINGS.stageWord;
  settings.gameFlow = normalizeGameFlow(settings.gameFlow);
  settings.teamNames = normalizeTeamNames(settings.teamNames);
  // A freshly created or broken file would stop the game from building, so it is rewritten right away.
  if (!parsed) await writeSettingsFile(handle, settings);
  return settings;
}

function writeSettingsFile(handle, settings) {
  return writeFileHandle(handle, JSON.stringify(settings, null, 2) + '\n');
}

function saveSettings() {
  return writeSettingsFile(state.settingsHandle, state.settings);
}

// ---------- Design tab: "Конструктор игры" — the order of slides the game walks through ----------
// The game reads settings.gameFlow the same way (game-flow.service.ts): the stages loop can't be switched off
// and anything missing falls back to the classic order.
const FLOW_BLOCK_IDS = ['welcome', 'teams', 'stages', 'end'];
const FLOW_BLOCK_LABELS = { welcome: 'Начало игры', teams: 'Названия команд', get stages() { return W.Pl + ' сценария'; }, end: 'Финал' };
const AFTER_STAGE_OPTIONS = [
  { value: 'winner', label: 'Победный балл' },
  { value: 'total', label: 'Сумма баллов' },
  { value: 'none', label: 'Ничего' },
];

function normalizeGameFlow(raw) {
  const flow = raw && typeof raw === 'object' ? raw : {};
  const rawBlocks = Array.isArray(flow.blocks) ? flow.blocks : [];
  const blocks = [];
  rawBlocks.forEach((block) => {
    const id = block && block.id;
    if (FLOW_BLOCK_IDS.includes(id) && !blocks.some((b) => b.id === id)) {
      blocks.push({ id, enabled: id === 'stages' || block.enabled !== false });
    }
  });
  FLOW_BLOCK_IDS.filter((id) => !blocks.some((b) => b.id === id)).forEach((id) => blocks.push({ id, enabled: true }));
  return {
    blocks,
    stagePreview: flow.stagePreview !== false,

function normalizeTeamNames(raw) {

// Applies one change to the flow, saves it and redraws the section; a failed save puts everything back.
async function changeGameFlow(change, doneText) {
  const previous = state.settings.gameFlow;
  const next = JSON.parse(JSON.stringify(previous));
  change(next);
  state.settings.gameFlow = next;
  try {
    await saveSettings();
    setStatus(doneText + ' — сохранено', 'saved');
  } catch (e) {
    state.settings.gameFlow = previous;
    setStatus('Не удалось сохранить порядок слайдов: ' + e.message, 'dirty');
  }
  refreshDesign();
}

function renderFlowChain() {
  const flow = state.settings.gameFlow;
  const word = state.settings.stageWord;
  const chain = document.createElement('div');
  chain.className = 'flow-chain';
  const pills = [];
  const addPill = (text, stage) => pills.push({ text, stage });

  flow.blocks.filter((b) => b.enabled).forEach((b) => {
    if (b.id !== 'stages') {
      addPill(FLOW_BLOCK_LABELS[b.id], false);
      return;
    }
    state.rounds.forEach((round, i) => {
      if (flow.stagePreview) addPill('Представление: ' + word + ' ' + (i + 1), false);
      addPill(word + ' ' + (i + 1), true);
      if (flow.afterStage === 'winner') addPill('Победный балл', false);
      if (flow.afterStage === 'total') addPill('Сумма баллов', false);
    });
  });

  if (!pills.length) {
    chain.textContent = 'Нет ни одного слайда: добавь ' + W.pl + ' во вкладке «Сценарии».';
    chain.classList.add('flow-note');
    return chain;

  pills.forEach((pill, i) => {
    if (i) {
      const arrow = document.createElement('span');
      arrow.className = 'flow-arrow';
      arrow.textContent = '→';
      chain.appendChild(arrow);
    }
    const el = document.createElement('span');
    el.className = 'flow-pill' + (pill.stage ? ' stage' : '');
    el.textContent = pill.text;
    chain.appendChild(el);
  });

}

// ---------- IndexedDB (remembers the last picked folder so we don't ask every time) ----------
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('constructor', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

// ---------- Status / error helpers ----------
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}
function markDirty() {
  state.dirty = true;
  btnSave.disabled = false;
  setStatus('Есть несохранённые изменения', 'dirty');
}
function markSaved() {
  state.dirty = false;
  btnSave.disabled = true;
  setStatus('Сохранено', 'saved');
}
function showError(message) {
  app.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
  heroError.textContent = message;
  heroError.style.display = '';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------- Opening the project folder ----------
async function pickFolder() {
  // If we remember a folder from last time, try to reuse it before prompting a new picker.
  if (state.pendingHandle) {
    const handle = state.pendingHandle;
    const perm = await handle.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
    if (perm === 'granted') {
      state.pendingHandle = null;
      await loadFromRoot(handle);
      return;
    }
    setStatus('Доступ не предоставлен', 'dirty');
  }
  if (!window.showDirectoryPicker) {
    showError('Этот браузер не поддерживает прямой доступ к файлам.\nОткрой этот файл в Chrome или Edge.');
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    return; // user cancelled the picker
  }
  await idbSet('root', handle);
  await loadFromRoot(handle);
}

async function tryRestore() {
  let handle;
  try {
    handle = await idbGet('root');
  } catch (e) {
    return;
  }
  if (!handle) return;
  const perm = await handle.queryPermission({ mode: 'readwrite' }).catch(() => 'prompt');
  if (perm === 'granted') {
    loadFromRoot(handle);
  } else {
    // Requesting permission needs a user gesture, so remember the handle and
    // let the "Открыть папку проекта" button reuse it on click.
    state.pendingHandle = handle;
  }
}

async function loadFromRoot(rootHandle) {
  setStatus('Загрузка…');
  try {
    const srcHandle = await rootHandle.getDirectoryHandle('src');
    const assetsHandle = await srcHandle.getDirectoryHandle('assets');
    const roundsHandle = await assetsHandle.getFileHandle('rounds.json');
    const imagesHandle = await assetsHandle.getDirectoryHandle('questions-images');
    const audioHandle = await assetsHandle.getDirectoryHandle('audio', { create: true });
    const backgroundHandle = await assetsHandle.getDirectoryHandle('background', { create: true });
    const fontsHandle = await assetsHandle.getDirectoryHandle('fonts', { create: true });
    const settingsHandle = await assetsHandle.getFileHandle('settings.json', { create: true });
    const scenariosHandle = await rootHandle.getDirectoryHandle('scenarios', { create: true });
    const stageBufferHandle = await rootHandle.getDirectoryHandle('stage-buffer', { create: true });
    const file = await roundsHandle.getFile();
    const text = await file.text();
    let rounds;
    try {
      rounds = JSON.parse(text);
    } catch (e) {
      showError('Не удалось прочитать rounds.json — файл повреждён или содержит не-JSON данные.');
      return;
    }
    state.roundsHandle = roundsHandle;
    state.imagesHandle = imagesHandle;
    state.audioHandle = audioHandle;
    state.backgroundHandle = backgroundHandle;
    state.fontsHandle = fontsHandle;
    state.settingsHandle = settingsHandle;
    state.settings = await loadSettings(settingsHandle);
    refreshStageWord();
    state.scenariosHandle = scenariosHandle;
    state.stageBufferHandle = stageBufferHandle;
    state.rounds = rounds;
    state.expanded = new Set();
    state.dirty = false;
    btnSave.disabled = true;
    setStatus('');
    btnSave.style.display = '';
    initialHint.style.display = 'none';
    heroBalloons.lightFromTop();
    heroError.style.display = 'none';
    tabsBar.style.display = '';
    render();
    await loadScenarioList();
    await loadStageBufferList();
    renderStorage();
  } catch (e) {
    showError(
      'В выбранной папке не найден src/assets/rounds.json.\n' +
      'Убедись, что выбрана именно папка "where-is-the-truth" (а не вложенная или родительская).\n\n' +
      'Техническая причина: ' + e.message
    );
  }
}

async function saveRounds() {
  if (!state.roundsHandle) return;
  setStatus('Сохранение…');
  try {
    const writable = await state.roundsHandle.createWritable();
    await writable.write(JSON.stringify(state.rounds, null, 2) + '\n');

    markSaved();
  } catch (e) {
    setStatus('Ошибка сохранения: ' + e.message, 'dirty');
  }
}

// ---------- Scenarios (saved sets of rounds, stored as scenarios/<name>.json) ----------
async function loadScenarioList() {
  const dir = state.scenariosHandle;
  const onDisk = new Set();
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'file' && name.endsWith('.json') && name !== '_order.json') {
      onDisk.add(name.slice(0, -5));
    }
  }
  let order = [];
  try {
    const orderHandle = await dir.getFileHandle('_order.json');
    const file = await orderHandle.getFile();
    const parsed = JSON.parse(await file.text());
    if (Array.isArray(parsed)) order = parsed;
  } catch (e) {
    order = [];
  }
  const ordered = order.filter((name) => onDisk.has(name));
  for (const name of onDisk) {
    if (!ordered.includes(name)) ordered.push(name);
  }
  state.scenarios = ordered;
  if (JSON.stringify(ordered) !== JSON.stringify(order)) {
    await saveScenarioOrder();
  }
}

async function saveScenarioOrder() {
  const orderHandle = await state.scenariosHandle.getFileHandle('_order.json', { create: true });
  const writable = await orderHandle.createWritable();
  await writable.write(JSON.stringify(state.scenarios, null, 2) + '\n');
  await writable.close();
}

function sanitizeScenarioName(raw) {
  return raw.trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 80);
}

// ---------- Stage buffer (saved single rounds, stored as stage-buffer/<name>.json) ----------
async function loadStageBufferList() {
  const dir = state.stageBufferHandle;
  const names = [];
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'file' && name.endsWith('.json')) {
      names.push(name.slice(0, -5));
    }
  }
  names.sort();
  state.stageBuffer = names;
}

async function saveRoundToBuffer(round) {
  if (!state.stageBufferHandle) return;
  const raw = prompt('Название ' + W.gen + ' для хранилища:', round.name || '');
  if (raw === null) return;
  const name = sanitizeScenarioName(raw);
  if (!name) {
    setStatus('Пустое или недопустимое название', 'dirty');
    return;
  }
  const exists = state.stageBuffer.includes(name);
  if (exists && !confirm(W.Nom + ' «' + name + '» уже есть в хранилище. Перезаписать?')) {
    return;
  }
  try {
    const fh = await state.stageBufferHandle.getFileHandle(name + '.json', { create: true });
    const writable = await fh.createWritable();
    await writable.write(JSON.stringify(round, null, 2) + '\n');
    await writable.close();
    if (!exists) {
      state.stageBuffer.push(name);
      state.stageBuffer.sort();
    }
    setStatus(W.Nom + ' «' + name + '» ' + W.pick('добавлен', 'добавлена', 'добавлено') + ' в хранилище', 'saved');
    state.storageTab = 'stages';
    renderStorage();
  } catch (e) {
    setStatus('Не удалось добавить ' + W.acc + ' в хранилище: ' + e.message, 'dirty');
  }
}

    state.expanded = new Set();
    render();
    await saveRounds();
    setStatus('Сценарий «' + name + '» загружен и применён к игре', 'saved');
  } catch (e) {
    setStatus('Не удалось загрузить сценарий: ' + e.message, 'dirty');
  }
}

async function deleteScenario(name) {
  if (!confirm('Удалить сценарий «' + name + '»? Это нельзя отменить.')) return;
  try {
    await state.scenariosHandle.removeEntry(name + '.json');
  } catch (e) {
    // already gone — fine, still remove it from the order below
  }
  state.scenarios = state.scenarios.filter((n) => n !== name);
  await saveScenarioOrder();
  renderStorage();
}

// ---------- Storage: one card for saved scenarios and saved single stages, switched by tabs ----------
// A scenario is a whole game and replaces the current one when loaded; a single stage is added to the current game.
function storageTabs() {
  return [
    {
      id: 'scenarios',
      label: 'Сценарии',
      items: state.scenarios,
      note: 'Сценарий — это вся игра целиком. Загрузи его, и он заменит текущий.',
      emptyText: 'Пока нет сохранённых сценариев. Чтобы сохранить текущую игру, нажми «Добавить сценарий в хранилище» ' +
        'справа над списком ' + W.genPl + '.',
      renderRow: renderScenarioRow,
    },
    {
      id: 'stages',
      label: W.Pl,
      items: state.stageBuffer,
      note: 'Отдельные ' + W.pl + ' — добавляй любой в текущий сценарий кнопкой «+».',
      emptyText: 'Пока нет сохранённых ' + W.genPl + '. Наведи на строку ' + W.gen + ' в текущей игре и нажми ' +

function renderStorage() {
  storagePanel.innerHTML = '';
  if (!state.scenariosHandle || !state.stageBufferHandle) return;

  const tabs = storageTabs();
  const active = tabs.find((t) => t.id === state.storageTab) || tabs[0];

  const box = document.createElement('div');
  box.className = 'storage-box';

  const head = document.createElement('div');
  head.className = 'storage-head';
  head.innerHTML = ICON_STACK;
  const titles = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'storage-title';
  title.textContent = 'Хранилище';
  const sub = document.createElement('div');
  sub.className = 'storage-sub';
  sub.textContent = 'Сохранённые сценарии и ' + W.pl;
  titles.appendChild(title);
  titles.appendChild(sub);
  head.appendChild(titles);
  box.appendChild(head);

  const switcher = document.createElement('div');
  switcher.className = 'storage-tabs';
  switcher.setAttribute('role', 'tablist');
  tabs.forEach((tab) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(tab === active));
    btn.className = tab === active ? 'active' : '';
    btn.textContent = tab.label;
    const count = document.createElement('span');
    count.className = 'storage-count';
    count.textContent = String(tab.items.length);
    btn.appendChild(count);
    btn.onclick = () => {
      state.storageTab = tab.id;
      renderStorage();
    };
    switcher.appendChild(btn);
  });
  box.appendChild(switcher);

  const note = document.createElement('div');
  note.className = 'storage-note';

    empty.textContent = active.emptyText;
    list.appendChild(empty);
  } else {
    active.items.forEach((name) => list.appendChild(active.renderRow(name)));

  box.appendChild(list);

  storagePanel.appendChild(box);

function renderScenarioRow(name) {
  const row = document.createElement('div');
  row.className = 'scenario-row';

  const top = document.createElement('div');

  const handle = document.createElement('span');

    const [moved] = state.scenarios.splice(from, 1);

// ---------- Round / question data helpers ----------
function newRound() {
  return { type: RoundType.Question, name: W.pick('Новый', 'Новая', 'Новое') + ' ' + W.nom, questions: [{ text: '' }] };
}
function applyTypeChange(round, type) {
  round.type = type;
  if (type === RoundType.Timer) {
    delete round.questions;
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else if (type === RoundType.QuestionWithTimer) {
    if (!round.questions) round.questions = [{ text: '' }];
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else {
    if (!round.questions) round.questions = [{ text: '' }];
    delete round.timer;
  }
}

// ---------- Rendering ----------
function render() {
  if (!state.rounds) return;
  closeBufferDropdown();
  app.innerHTML = '';

  const toolbar = document.createElement('div');
  toolbar.className = 'scenario-toolbar';
  const saveScenarioBtn = createIconBtn(ICON_STACK_PUSH, 'Добавить сценарий в хранилище');
  saveScenarioBtn.onclick = () => saveCurrentAsScenario();
  toolbar.appendChild(saveScenarioBtn);
  app.appendChild(toolbar);

  if (state.settings.gameFlow.teamsMode === 'preset') app.appendChild(renderTeamNamesBlock());

  if (state.rounds.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = W.GenPl + ' пока нет.';
    app.appendChild(empty);
  }

  if (state.rounds.length > 0) {
    const list = document.createElement('div');
    list.className = 'round-list';
    state.rounds.forEach((round, index) => {
      list.appendChild(renderRoundCard(round, index));
    });
    app.appendChild(list);
  }

  const controls = document.createElement('div');
  controls.className = 'add-round-controls';

  const addBtn = document.createElement('button');
  addBtn.className = 'add-round-btn';
  addBtn.textContent = '+ Добавить ' + W.acc;
  addBtn.onclick = () => {
    state.rounds.push(newRound());
    state.expanded.add(state.rounds.length - 1);
    markDirty();
    render();
  };
  controls.appendChild(addBtn);

  const bufferWrap = document.createElement('div');
  bufferWrap.className = 'add-from-buffer-wrap';
  const bufferBtn = document.createElement('button');
  bufferBtn.className = 'add-round-btn';
  bufferBtn.textContent = '+ Добавить из хранилища';
  bufferBtn.onclick = (e) => {
    e.stopPropagation();
    toggleBufferDropdown(bufferWrap);
  };
  bufferWrap.appendChild(bufferBtn);
  controls.appendChild(bufferWrap);

  app.appendChild(controls);
}

// ---------- Stage buffer dropdown ("+ Добавить из хранилища") ----------
let bufferDropdownEl = null;
let bufferWrapEl = null;

function closeBufferDropdown() {
  if (bufferDropdownEl) bufferDropdownEl.remove();
  bufferDropdownEl = null;
  bufferWrapEl = null;
  document.removeEventListener('click', onBufferDropdownOutsideClick);
  document.removeEventListener('keydown', onBufferDropdownEscape);
}

function onBufferDropdownOutsideClick(e) {
  if (bufferWrapEl && !bufferWrapEl.contains(e.target)) closeBufferDropdown();
}

function onBufferDropdownEscape(e) {
  if (e.key === 'Escape') closeBufferDropdown();
}

function toggleBufferDropdown(wrapEl) {
  if (bufferDropdownEl) {
    closeBufferDropdown();
    return;
  }
  bufferWrapEl = wrapEl;
  bufferDropdownEl = document.createElement('div');
  bufferDropdownEl.className = 'buffer-dropdown';
  wrapEl.appendChild(bufferDropdownEl);
  renderBufferDropdown();
  setTimeout(() => {
    document.addEventListener('click', onBufferDropdownOutsideClick);
    document.addEventListener('keydown', onBufferDropdownEscape);
  }, 0);
}

function renderBufferDropdown() {
  if (!bufferDropdownEl) return;
  bufferDropdownEl.innerHTML = '';

  if (state.stageBuffer.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'buffer-dropdown-empty';
    empty.textContent = 'Хранилище пусто';
    bufferDropdownEl.appendChild(empty);
    return;
  }

  state.stageBuffer.forEach((name) => {
    const row = document.createElement('div');
    row.className = 'buffer-dropdown-row';

    const label = document.createElement('span');
    label.className = 'buffer-dropdown-name';
    label.textContent = name;
    label.onclick = () => addBufferRoundToCurrent(name);
    row.appendChild(label);

    const delBtn = createIconBtn(ICON_TRASH, 'Удалить из хранилища', true);
    delBtn.classList.add('compact');
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteRoundFromBuffer(name);
    };
    row.appendChild(delBtn);

    bufferDropdownEl.appendChild(row);
  });
}
