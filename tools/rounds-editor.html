<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор этапов — where-is-the-truth</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #dde1e6;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0 16px 0 0;
    white-space: nowrap;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
  }
  button:hover { background: #f0f1f5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--danger); }
  button.danger:hover { background: var(--danger-bg); }
  #status {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  #status.dirty { color: #b45309; }
  #status.saved { color: var(--success); }
  .tabs {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 500;
  }
  .tab-btn:hover {
    background: #f0f1f5;
    color: var(--text);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin: 24px 0 80px;
    padding: 0 16px;
  }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sidebar:has(#scenariosPanel:empty) { display: none; }
  .scenario-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .storage-heading {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 0 2px;
  }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
  }
  main {
    flex: 1;
    min-width: 0;
    max-width: 760px;
  }
  .hint {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .scenarios-panel:empty { display: none; }
  .scenarios-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .scenarios-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    cursor: pointer;
  }
  .scenarios-box:not(.expanded) .scenarios-header { border-bottom: none; }
  .scenarios-header .chevron { transition: transform .15s; }
  .scenarios-box.expanded .scenarios-header .chevron { transform: rotate(90deg); }
  .scenarios-list {
    display: flex;
    flex-direction: column;
  }
  .scenario-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  .scenario-row:first-child { border-top: none; }
  .scenario-row.drag-over { border-top-color: var(--accent); }
  .scenario-row-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .scenario-name {
    flex: 1;
    min-width: 0;
    white-space: normal;
    word-break: break-word;
  }
  .scenario-row-actions {
    display: flex;
    gap: 8px;
    padding-left: 26px;
  }
  .scenarios-empty {
    padding: 16px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  .design-sections {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .design-section-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border: none;
    border-top: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
  }
  .design-section-item:first-child { border-top: none; }
  .design-section-item.active {
    background: var(--accent);
    color: #fff;
  }
  .sound-slot {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .sound-slot label {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .sound-slot-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sound-slot audio {
    height: 32px;
    max-width: 260px;
  }
  .error {
    background: var(--danger-bg);
    border: 1px solid #fecaca;
    color: var(--danger);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .round-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .round-card.drag-over { border-color: var(--accent); }
  .round-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .drag-handle {
    cursor: grab;
    color: var(--muted);
    font-size: 18px;
    padding: 2px 4px;
    user-select: none;
  }
  .round-num {
    color: var(--muted);
    font-size: 13px;
    min-width: 20px;
  }
  .round-name {
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .round-delete-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .round-delete-btn:hover {
    color: var(--danger);
    background: var(--danger-bg);
  }
  .chevron { color: var(--muted); transition: transform .15s; }
  .round-card.expanded .chevron { transform: rotate(90deg); }
  .round-body {
    border-top: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  input[type="text"], input[type="number"], select, textarea {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .field-row > div { flex: 1; min-width: 160px; }
  .questions-list { display: flex; flex-direction: column; gap: 10px; }
  .question-row {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .question-row.drag-over { border-color: var(--accent); }
  .question-main { flex: 1; min-width: 0; }
  .kind-toggle {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .kind-toggle button {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 999px;
  }
  .kind-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .image-drop {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .image-drop:hover { border-color: var(--accent); background: #eef2ff; }
  .image-preview {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .image-preview img {
    max-width: 110px;
    max-height: 70px;
    border-radius: 6px;
    border: 1px solid var(--border);
    object-fit: contain;
    background: var(--bg);
  }
  .image-preview .path {
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .row-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .small-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  .add-round-btn {
    width: 100%;
    padding: 12px;
    border-style: dashed;
    color: var(--muted);
  }
  .add-round-controls {
    display: flex;
    gap: 10px;
  }
  .add-round-controls > .add-round-btn,
  .add-round-controls > .add-from-buffer-wrap {
    flex: 1;
  }
  .add-from-buffer-wrap {
    position: relative;
  }
  .buffer-dropdown {
    position: absolute;
    bottom: 0;
    left: calc(100% + 6px);
    min-width: 240px;
    max-width: 320px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    text-align: left;
  }
  .buffer-dropdown-empty {
    padding: 12px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  .buffer-dropdown-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .buffer-dropdown-row:first-child { border-top: none; }
  .buffer-dropdown-row:hover { background: #f0f1f5; }
  .buffer-dropdown-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .buffer-dropdown-delete {
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .buffer-dropdown-delete:hover {
    color: var(--danger);
    background: var(--danger-bg);
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
</style>
</head>
<body>
<header>
  <h1>Редактор <small style="font-size:11px;color:#9ca3af;font-weight:400">build 10</small></h1>
  <button id="btnOpen">Открыть папку проекта…</button>
  <button id="btnReopen" style="display:none">Открыть ту же папку снова</button>
  <button id="btnSave" class="primary" disabled>Сохранить</button>
  <nav id="tabs" class="tabs" style="display:none">
    <button class="tab-btn" data-tab="scenarios">Сценарии</button>
    <button class="tab-btn" data-tab="design">Дизайн</button>
  </nav>
  <span id="status"></span>
</header>
<div id="initialHint" class="hint" style="margin:24px 16px;">
  Нажмите «Открыть папку проекта» и выберите папку <b>where-is-the-truth</b> на своём компьютере.
  Работает только в <b>Chrome</b> или <b>Edge</b>.
</div>
<div id="tabPanelDesign" class="layout" style="display:none">
  <aside class="sidebar">
    <div id="designSectionsList" class="design-sections"></div>
  </aside>
  <main id="designSectionContent"></main>
</div>
<div id="tabPanelScenarios" class="layout" style="display:none">
  <aside class="sidebar">
    <div class="storage-heading">Хранилище</div>
    <div id="scenariosPanel" class="scenarios-panel"></div>
    <div id="stageBufferPanel" class="scenarios-panel"></div>
  </aside>
  <main id="app"></main>
</div>

<script>
'use strict';

const RoundType = {
  Question: 'Question',
  QuestionWithTimer: 'Question with timer',
  Timer: 'Timer',
};

const state = {
  rootHandle: null,
  imagesHandle: null,
  roundsHandle: null,
  rounds: null,
  expanded: new Set(),
  dirty: false,
  dragRoundFrom: null,
  scenariosHandle: null,
  scenarios: [], // ordered list of scenario names (without .json)
  scenariosExpanded: false,
  stageBufferHandle: null,
  stageBuffer: [], // sorted list of saved single-round template names (without .json)
  stageBufferExpanded: false,
  activeTab: null,
};

const app = document.getElementById('app');
const scenariosPanel = document.getElementById('scenariosPanel');
const stageBufferPanel = document.getElementById('stageBufferPanel');
const statusEl = document.getElementById('status');
const btnOpen = document.getElementById('btnOpen');
const btnReopen = document.getElementById('btnReopen');
const btnSave = document.getElementById('btnSave');
const initialHint = document.getElementById('initialHint');
const tabsBar = document.getElementById('tabs');
const tabButtons = tabsBar.querySelectorAll('.tab-btn');
const layoutEl = document.getElementById('tabPanelScenarios');
const designPanel = document.getElementById('tabPanelDesign');
const designSectionsList = document.getElementById('designSectionsList');
const designSectionContent = document.getElementById('designSectionContent');

function setActiveTab(tab) {
  state.activeTab = tab;
  tabButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === tab));
  layoutEl.style.display = tab === 'scenarios' ? '' : 'none';
  designPanel.style.display = tab === 'design' ? '' : 'none';
  if (tab === 'design' && !activeDesignSection) {
    setActiveDesignSection(DESIGN_SECTIONS[0].id);
  }
}

tabButtons.forEach((btn) => {
  btn.onclick = () => setActiveTab(btn.dataset.tab);
});

// ---------- Design tab: sections list ----------
const DESIGN_SECTIONS = [
  { id: 'sounds', label: 'Звуки', render: renderSoundsSection },
];
let activeDesignSection = null;

function renderDesignSectionsList() {
  designSectionsList.innerHTML = '';
  DESIGN_SECTIONS.forEach((section) => {
    const btn = document.createElement('button');
    btn.className = 'design-section-item' + (section.id === activeDesignSection ? ' active' : '');
    btn.textContent = section.label;
    btn.onclick = () => setActiveDesignSection(section.id);
    designSectionsList.appendChild(btn);
  });
}

function setActiveDesignSection(id) {
  activeDesignSection = id;
  renderDesignSectionsList();
  const section = DESIGN_SECTIONS.find((s) => s.id === id);
  designSectionContent.innerHTML = '';
  if (section) section.render(designSectionContent);
}

// ---------- Design tab: Sounds section ----------
const SOUND_SLOTS = [
  { id: 'end-timer.mp3', label: 'Конец таймера' },
  { id: 'win-question.mp3', label: 'Начисление баллов' },
  { id: 'lose-question.mp3', label: 'Ошибочный ответ' },
];

function renderSoundsSection(container) {
  SOUND_SLOTS.forEach((slot) => {
    container.appendChild(renderSoundSlot(slot));
  });
}

function renderSoundSlot(slot) {
  const box = document.createElement('div');
  box.className = 'sound-slot';

  const label = document.createElement('label');
  label.textContent = slot.label;
  box.appendChild(label);

  const controls = document.createElement('div');
  controls.className = 'sound-slot-controls';

  const audio = document.createElement('audio');
  audio.controls = true;
  controls.appendChild(audio);

  const changeBtn = document.createElement('button');
  changeBtn.className = 'small-btn';
  changeBtn.textContent = 'Заменить файл';
  changeBtn.onclick = () => pickSoundFile(slot);
  controls.appendChild(changeBtn);

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'danger small-btn';
  deleteBtn.textContent = 'Удалить файл';
  deleteBtn.onclick = () => deleteSoundFile(slot);
  controls.appendChild(deleteBtn);

  box.appendChild(controls);

  loadSoundPreview(slot.id, audio);

  return box;
}

function loadSoundPreview(fileName, audioEl) {
  state.audioHandle.getFileHandle(fileName)
    .then((fh) => fh.getFile())
    .then((file) => { audioEl.src = URL.createObjectURL(file); })
    .catch(() => {});
}

async function pickSoundFile(slot) {
  if (!window.showOpenFilePicker) {
    setStatus('Этот браузер не поддерживает выбор файла таким способом.', 'dirty');
    return;
  }
  let handles;
  try {
    handles = await window.showOpenFilePicker({
      id: 'design-sounds',
      multiple: false,
      excludeAcceptAllOption: false,
      types: [{
        description: 'MP3',
        accept: { 'audio/mpeg': ['.mp3'] },
      }],
    });
  } catch (e) {
    return; // user cancelled the dialog
  }
  try {
    const file = await handles[0].getFile();
    const targetHandle = await state.audioHandle.getFileHandle(slot.id, { create: true });
    const writable = await targetHandle.createWritable();
    await writable.write(await file.arrayBuffer());
    await writable.close();
    setStatus('Звук «' + slot.label + '» обновлён', 'saved');
    if (activeDesignSection === 'sounds') setActiveDesignSection('sounds');
  } catch (e) {
    setStatus('Не удалось сохранить звук: ' + e.message, 'dirty');
  }
}

async function deleteSoundFile(slot) {
  if (!confirm('Удалить звук «' + slot.label + '»?')) return;
  try {
    await state.audioHandle.removeEntry(slot.id);
    setStatus('Звук «' + slot.label + '» удалён', 'saved');
  } catch (e) {
    setStatus('Не удалось удалить звук: ' + e.message, 'dirty');
  }
  if (activeDesignSection === 'sounds') setActiveDesignSection('sounds');
}

// ---------- IndexedDB (remembers the last picked folder so we don't ask every time) ----------
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rounds-editor', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

// ---------- Status / error helpers ----------
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}
function markDirty() {
  state.dirty = true;
  btnSave.disabled = false;
  setStatus('Есть несохранённые изменения', 'dirty');
}
function markSaved() {
  state.dirty = false;
  btnSave.disabled = true;
  setStatus('Сохранено', 'saved');
}
function showError(message) {
  app.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------- Opening the project folder ----------
async function pickFolder() {
  if (!window.showDirectoryPicker) {
    showError('Этот браузер не поддерживает прямой доступ к файлам.\nОткройте этот файл в Chrome или Edge.');
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    return; // user cancelled the picker
  }
  await idbSet('root', handle);
  await loadFromRoot(handle);
}

async function tryRestore() {
  let handle;
  try {
    handle = await idbGet('root');
  } catch (e) {
    return;
  }
  if (!handle) return;
  const perm = await handle.queryPermission({ mode: 'readwrite' }).catch(() => 'prompt');
  if (perm === 'granted') {
    loadFromRoot(handle);
  } else {
    btnReopen.style.display = '';
    btnReopen.onclick = async () => {
      const p = await handle.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
      if (p === 'granted') {
        btnReopen.style.display = 'none';
        loadFromRoot(handle);
      } else {
        setStatus('Доступ не предоставлен', 'dirty');
      }
    };
  }
}

async function loadFromRoot(rootHandle) {
  setStatus('Загрузка…');
  try {
    const srcHandle = await rootHandle.getDirectoryHandle('src');
    const assetsHandle = await srcHandle.getDirectoryHandle('assets');
    const roundsHandle = await assetsHandle.getFileHandle('rounds.json');
    const imagesHandle = await assetsHandle.getDirectoryHandle('questions-images');
    const audioHandle = await assetsHandle.getDirectoryHandle('audio', { create: true });
    const scenariosHandle = await rootHandle.getDirectoryHandle('scenarios', { create: true });
    const stageBufferHandle = await rootHandle.getDirectoryHandle('stage-buffer', { create: true });
    const file = await roundsHandle.getFile();
    const text = await file.text();
    let rounds;
    try {
      rounds = JSON.parse(text);
    } catch (e) {
      showError('Не удалось прочитать rounds.json — файл повреждён или содержит не-JSON данные.');
      return;
    }
    state.rootHandle = rootHandle;
    state.roundsHandle = roundsHandle;
    state.imagesHandle = imagesHandle;
    state.audioHandle = audioHandle;
    state.scenariosHandle = scenariosHandle;
    state.stageBufferHandle = stageBufferHandle;
    state.rounds = rounds;
    state.expanded = new Set();
    state.dirty = false;
    btnSave.disabled = true;
    setStatus('Открыто: ' + rootHandle.name);
    btnOpen.style.display = 'none';
    btnReopen.style.display = 'none';
    initialHint.style.display = 'none';
    tabsBar.style.display = '';
    render();
    await loadScenarioList();
    renderScenarios();
    await loadStageBufferList();
    renderStageBufferPanel();
  } catch (e) {
    showError(
      'В выбранной папке не найден src/assets/rounds.json.\n' +
      'Убедитесь, что вы выбрали именно папку "where-is-the-truth" (а не вложенную/родительскую папку).\n\n' +
      'Техническая причина: ' + e.message
    );
  }
}

// ---------- Saving ----------
async function saveRounds() {
  if (!state.roundsHandle) return;
  setStatus('Сохранение…');
  try {
    const writable = await state.roundsHandle.createWritable();
    await writable.write(JSON.stringify(state.rounds, null, 2) + '\n');
    await writable.close();
    markSaved();
  } catch (e) {
    setStatus('Ошибка сохранения: ' + e.message, 'dirty');
  }
}

// ---------- Scenarios (saved sets of rounds, stored as scenarios/<name>.json) ----------
async function loadScenarioList() {
  const dir = state.scenariosHandle;
  const onDisk = new Set();
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'file' && name.endsWith('.json') && name !== '_order.json') {
      onDisk.add(name.slice(0, -5));
    }
  }
  let order = [];
  try {
    const orderHandle = await dir.getFileHandle('_order.json');
    const file = await orderHandle.getFile();
    const parsed = JSON.parse(await file.text());
    if (Array.isArray(parsed)) order = parsed;
  } catch (e) {
    order = [];
  }
  const ordered = order.filter((name) => onDisk.has(name));
  for (const name of onDisk) {
    if (!ordered.includes(name)) ordered.push(name);
  }
  state.scenarios = ordered;
  if (JSON.stringify(ordered) !== JSON.stringify(order)) {
    await saveScenarioOrder();
  }
}

async function saveScenarioOrder() {
  const orderHandle = await state.scenariosHandle.getFileHandle('_order.json', { create: true });
  const writable = await orderHandle.createWritable();
  await writable.write(JSON.stringify(state.scenarios, null, 2) + '\n');
  await writable.close();
}

function sanitizeScenarioName(raw) {
  return raw.trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 80);
}

// ---------- Stage buffer (saved single rounds, stored as stage-buffer/<name>.json) ----------
async function loadStageBufferList() {
  const dir = state.stageBufferHandle;
  const names = [];
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'file' && name.endsWith('.json')) {
      names.push(name.slice(0, -5));
    }
  }
  names.sort();
  state.stageBuffer = names;
}

async function saveRoundToBuffer(round) {
  if (!state.stageBufferHandle) return;
  const raw = prompt('Название этапа для хранилища:', round.name || '');
  if (raw === null) return;
  const name = sanitizeScenarioName(raw);
  if (!name) {
    setStatus('Пустое или недопустимое название', 'dirty');
    return;
  }
  const exists = state.stageBuffer.includes(name);
  if (exists && !confirm('Этап «' + name + '» уже есть в хранилище. Перезаписать?')) {
    return;
  }
  try {
    const fh = await state.stageBufferHandle.getFileHandle(name + '.json', { create: true });
    const writable = await fh.createWritable();
    await writable.write(JSON.stringify(round, null, 2) + '\n');
    await writable.close();
    if (!exists) {
      state.stageBuffer.push(name);
      state.stageBuffer.sort();
    }
    setStatus('Этап «' + name + '» добавлен в хранилище', 'saved');
    renderStageBufferPanel();
  } catch (e) {
    setStatus('Не удалось добавить этап в хранилище: ' + e.message, 'dirty');
  }
}

async function loadRoundFromBuffer(name) {
  const fh = await state.stageBufferHandle.getFileHandle(name + '.json');
  const file = await fh.getFile();
  return JSON.parse(await file.text());
}

async function addBufferRoundToCurrent(name) {
  const data = await loadRoundFromBuffer(name);
  state.rounds.push(JSON.parse(JSON.stringify(data)));
  markDirty();
  render();
}

async function deleteRoundFromBuffer(name) {
  if (!confirm('Удалить этап «' + name + '» из хранилища? Это нельзя отменить.')) return;
  try {
    await state.stageBufferHandle.removeEntry(name + '.json');
  } catch (e) {
    // already gone — fine
  }
  state.stageBuffer = state.stageBuffer.filter((n) => n !== name);
  renderBufferDropdown();
  renderStageBufferPanel();
}

async function saveCurrentAsScenario() {
  if (!state.scenariosHandle) return;
  const raw = prompt('Название сценария:');
  if (raw === null) return;
  const name = sanitizeScenarioName(raw);
  if (!name) {
    setStatus('Пустое или недопустимое название сценария', 'dirty');
    return;
  }
  const exists = state.scenarios.includes(name);
  if (exists && !confirm('Сценарий «' + name + '» уже существует. Перезаписать его текущим набором этапов?')) {
    return;
  }
  try {
    const fh = await state.scenariosHandle.getFileHandle(name + '.json', { create: true });
    const writable = await fh.createWritable();
    await writable.write(JSON.stringify(state.rounds, null, 2) + '\n');
    await writable.close();
    if (!exists) {
      state.scenarios.push(name);
      await saveScenarioOrder();
    }
    setStatus('Сценарий «' + name + '» сохранён', 'saved');
    renderScenarios();
  } catch (e) {
    setStatus('Не удалось сохранить сценарий: ' + e.message, 'dirty');
  }
}

async function loadScenario(name) {
  try {
    const fh = await state.scenariosHandle.getFileHandle(name + '.json');
    const file = await fh.getFile();
    state.rounds = JSON.parse(await file.text());
    state.expanded = new Set();
    render();
    await saveRounds();
    setStatus('Сценарий «' + name + '» загружен и применён к игре', 'saved');
  } catch (e) {
    setStatus('Не удалось загрузить сценарий: ' + e.message, 'dirty');
  }
}

async function deleteScenario(name) {
  if (!confirm('Удалить сценарий «' + name + '»? Это нельзя отменить.')) return;
  try {
    await state.scenariosHandle.removeEntry(name + '.json');
  } catch (e) {
    // already gone — fine, still remove it from the order below
  }
  state.scenarios = state.scenarios.filter((n) => n !== name);
  await saveScenarioOrder();
  renderScenarios();
}

let dragScenarioFrom = null;

function renderScenarios() {
  scenariosPanel.innerHTML = '';
  if (!state.scenariosHandle) return;

  const box = document.createElement('div');
  box.className = 'scenarios-box' + (state.scenariosExpanded ? ' expanded' : '');

  const header = document.createElement('div');
  header.className = 'scenarios-header';
  header.onclick = () => {
    state.scenariosExpanded = !state.scenariosExpanded;
    renderScenarios();
  };

  const title = document.createElement('span');
  title.textContent = 'Сценарии';
  header.appendChild(title);

  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.textContent = '›';
  header.appendChild(chevron);

  box.appendChild(header);

  if (state.scenariosExpanded) {
    const list = document.createElement('div');
    list.className = 'scenarios-list';

    if (state.scenarios.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'scenarios-empty';
      empty.textContent = 'Пока нет сохранённых сценариев.';
      list.appendChild(empty);
    } else {
      state.scenarios.forEach((name, index) => {
        list.appendChild(renderScenarioRow(name, index));
      });
    }

    box.appendChild(list);
  }

  scenariosPanel.appendChild(box);
}

function renderScenarioRow(name, index) {
  const row = document.createElement('div');
  row.className = 'scenario-row';

  const top = document.createElement('div');
  top.className = 'scenario-row-top';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.draggable = true;
  handle.title = 'Перетащите, чтобы изменить порядок';
  handle.addEventListener('dragstart', (e) => {
    dragScenarioFrom = index;
    e.dataTransfer.effectAllowed = 'move';
  });
  top.appendChild(handle);

  const label = document.createElement('span');
  label.className = 'scenario-name';
  label.textContent = name;
  top.appendChild(label);
  row.appendChild(top);

  const actions = document.createElement('div');
  actions.className = 'scenario-row-actions';

  const loadBtn = document.createElement('button');
  loadBtn.className = 'primary small-btn';
  loadBtn.textContent = 'Загрузить';
  loadBtn.onclick = () => loadScenario(name);
  actions.appendChild(loadBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'danger small-btn';
  delBtn.textContent = 'Удалить';
  delBtn.onclick = () => deleteScenario(name);
  actions.appendChild(delBtn);
  row.appendChild(actions);

  row.addEventListener('dragover', (e) => {
    if (dragScenarioFrom === null) return;
    e.preventDefault();
    row.classList.add('drag-over');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', async (e) => {
    e.preventDefault();
    row.classList.remove('drag-over');
    const from = dragScenarioFrom;
    dragScenarioFrom = null;
    if (from === null || from === index) return;
    const [moved] = state.scenarios.splice(from, 1);
    state.scenarios.splice(index, 0, moved);
    await saveScenarioOrder();
    renderScenarios();
  });

  return row;
}

function renderStageBufferPanel() {
  stageBufferPanel.innerHTML = '';
  if (!state.stageBufferHandle) return;

  const box = document.createElement('div');
  box.className = 'scenarios-box' + (state.stageBufferExpanded ? ' expanded' : '');

  const header = document.createElement('div');
  header.className = 'scenarios-header';
  header.onclick = () => {
    state.stageBufferExpanded = !state.stageBufferExpanded;
    renderStageBufferPanel();
  };

  const title = document.createElement('span');
  title.textContent = 'Этапы';
  header.appendChild(title);

  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.textContent = '›';
  header.appendChild(chevron);

  box.appendChild(header);

  if (state.stageBufferExpanded) {
    const list = document.createElement('div');
    list.className = 'scenarios-list';

    if (state.stageBuffer.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'scenarios-empty';
      empty.textContent = 'Пока нет сохранённых этапов.';
      list.appendChild(empty);
    } else {
      state.stageBuffer.forEach((name) => {
        list.appendChild(renderStageBufferRow(name));
      });
    }

    box.appendChild(list);
  }

  stageBufferPanel.appendChild(box);
}

function renderStageBufferRow(name) {
  const row = document.createElement('div');
  row.className = 'scenario-row';

  const top = document.createElement('div');
  top.className = 'scenario-row-top';

  const label = document.createElement('span');
  label.className = 'scenario-name';
  label.textContent = name;
  top.appendChild(label);
  row.appendChild(top);

  const actions = document.createElement('div');
  actions.className = 'scenario-row-actions';

  const addBtn = document.createElement('button');
  addBtn.className = 'primary small-btn';
  addBtn.textContent = 'Добавить';
  addBtn.onclick = () => addBufferRoundToCurrent(name);
  actions.appendChild(addBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'danger small-btn';
  delBtn.textContent = 'Удалить';
  delBtn.onclick = () => deleteRoundFromBuffer(name);
  actions.appendChild(delBtn);
  row.appendChild(actions);

  return row;
}

// ---------- Round / question data helpers ----------
function newRound() {
  return { type: RoundType.Question, name: 'Новый этап', questions: [{ text: '' }] };
}
function applyTypeChange(round, type) {
  round.type = type;
  if (type === RoundType.Timer) {
    delete round.questions;
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else if (type === RoundType.QuestionWithTimer) {
    if (!round.questions) round.questions = [{ text: '' }];
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else {
    if (!round.questions) round.questions = [{ text: '' }];
    delete round.timer;
  }
}

// ---------- Rendering ----------
function render() {
  if (!state.rounds) return;
  closeBufferDropdown();
  app.innerHTML = '';

  const toolbar = document.createElement('div');
  toolbar.className = 'scenario-toolbar';
  const saveScenarioBtn = document.createElement('button');
  saveScenarioBtn.className = 'small-btn';
  saveScenarioBtn.textContent = 'Добавить сценарий в хранилище';
  saveScenarioBtn.onclick = () => saveCurrentAsScenario();
  toolbar.appendChild(saveScenarioBtn);
  app.appendChild(toolbar);

  if (state.rounds.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Этапов пока нет.';
    app.appendChild(empty);
  }

  state.rounds.forEach((round, index) => {
    app.appendChild(renderRoundCard(round, index));
  });

  const controls = document.createElement('div');
  controls.className = 'add-round-controls';

  const addBtn = document.createElement('button');
  addBtn.className = 'add-round-btn';
  addBtn.textContent = '+ Добавить этап';
  addBtn.onclick = () => {
    state.rounds.push(newRound());
    state.expanded.add(state.rounds.length - 1);
    markDirty();
    render();
  };
  controls.appendChild(addBtn);

  const bufferWrap = document.createElement('div');
  bufferWrap.className = 'add-from-buffer-wrap';
  const bufferBtn = document.createElement('button');
  bufferBtn.className = 'add-round-btn';
  bufferBtn.textContent = '+ Добавить из хранилища';
  bufferBtn.onclick = (e) => {
    e.stopPropagation();
    toggleBufferDropdown(bufferWrap);
  };
  bufferWrap.appendChild(bufferBtn);
  controls.appendChild(bufferWrap);

  app.appendChild(controls);
}

// ---------- Stage buffer dropdown ("+ Добавить из хранилища") ----------
let bufferDropdownEl = null;
let bufferWrapEl = null;

function closeBufferDropdown() {
  if (bufferDropdownEl) bufferDropdownEl.remove();
  bufferDropdownEl = null;
  bufferWrapEl = null;
  document.removeEventListener('click', onBufferDropdownOutsideClick);
  document.removeEventListener('keydown', onBufferDropdownEscape);
}

function onBufferDropdownOutsideClick(e) {
  if (bufferWrapEl && !bufferWrapEl.contains(e.target)) closeBufferDropdown();
}

function onBufferDropdownEscape(e) {
  if (e.key === 'Escape') closeBufferDropdown();
}

function toggleBufferDropdown(wrapEl) {
  if (bufferDropdownEl) {
    closeBufferDropdown();
    return;
  }
  bufferWrapEl = wrapEl;
  bufferDropdownEl = document.createElement('div');
  bufferDropdownEl.className = 'buffer-dropdown';
  wrapEl.appendChild(bufferDropdownEl);
  renderBufferDropdown();
  setTimeout(() => {
    document.addEventListener('click', onBufferDropdownOutsideClick);
    document.addEventListener('keydown', onBufferDropdownEscape);
  }, 0);
}

function renderBufferDropdown() {
  if (!bufferDropdownEl) return;
  bufferDropdownEl.innerHTML = '';

  if (state.stageBuffer.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'buffer-dropdown-empty';
    empty.textContent = 'Хранилище пусто';
    bufferDropdownEl.appendChild(empty);
    return;
  }

  state.stageBuffer.forEach((name) => {
    const row = document.createElement('div');
    row.className = 'buffer-dropdown-row';

    const label = document.createElement('span');
    label.className = 'buffer-dropdown-name';
    label.textContent = name;
    label.onclick = () => addBufferRoundToCurrent(name);
    row.appendChild(label);

    const delBtn = document.createElement('button');
    delBtn.className = 'buffer-dropdown-delete';
    delBtn.textContent = '✕';
    delBtn.title = 'Удалить из хранилища';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteRoundFromBuffer(name);
    };
    row.appendChild(delBtn);

    bufferDropdownEl.appendChild(row);
  });
}

function renderRoundCard(round, index) {
  const card = document.createElement('div');
  card.className = 'round-card' + (state.expanded.has(index) ? ' expanded' : '');
  card.dataset.index = String(index);

  const head = document.createElement('div');
  head.className = 'round-head';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.draggable = true;
  handle.title = 'Перетащите, чтобы изменить порядок';
  handle.addEventListener('dragstart', (e) => {
    state.dragRoundFrom = index;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(index));
  });
  head.appendChild(handle);

  const num = document.createElement('span');
  num.className = 'round-num';
  num.textContent = (index + 1) + '.';
  head.appendChild(num);

  const name = document.createElement('span');
  name.className = 'round-name';
  name.textContent = round.name || '(без названия)';
  head.appendChild(name);

  const saveToBufferBtn = document.createElement('button');
  saveToBufferBtn.className = 'small-btn';
  saveToBufferBtn.textContent = 'Добавить в хранилище';
  saveToBufferBtn.onclick = (e) => {
    e.stopPropagation();
    saveRoundToBuffer(round);
  };
  head.appendChild(saveToBufferBtn);

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'round-delete-btn';
  deleteBtn.textContent = '✕';
  deleteBtn.title = 'Удалить этап';
  deleteBtn.onclick = (e) => {
    e.stopPropagation();
    if (!confirm('Удалить этап "' + (round.name || '') + '"?')) return;
    state.rounds.splice(index, 1);
    state.expanded.delete(index);
    markDirty();
    render();
  };
  head.appendChild(deleteBtn);

  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.textContent = '›';
  head.appendChild(chevron);

  head.addEventListener('click', () => {
    if (state.expanded.has(index)) state.expanded.delete(index);
    else state.expanded.add(index);
    render();
  });
  card.appendChild(head);

  card.addEventListener('dragover', (e) => {
    if (state.dragRoundFrom === null) return;
    e.preventDefault();
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const from = state.dragRoundFrom;
    state.dragRoundFrom = null;
    if (from === null || from === index) return;
    const [moved] = state.rounds.splice(from, 1);
    state.rounds.splice(index, 0, moved);
    markDirty();
    render();
  });

  if (state.expanded.has(index)) {
    card.appendChild(renderRoundBody(round, index));
  }

  return card;
}

function typeLabel(type) {
  if (type === RoundType.Question) return 'Вопросы';
  if (type === RoundType.QuestionWithTimer) return 'Вопросы + таймер';
  if (type === RoundType.Timer) return 'Таймер';
  return type;
}

function renderRoundBody(round, index) {
  const body = document.createElement('div');
  body.className = 'round-body';
  body.addEventListener('click', (e) => e.stopPropagation());

  // Name + type row
  const row1 = document.createElement('div');
  row1.className = 'field-row';

  const nameField = document.createElement('div');
  const nameLabel = document.createElement('label');
  nameLabel.textContent = 'Название этапа';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.value = round.name || '';
  nameInput.oninput = () => { round.name = nameInput.value; markDirty(); renderNameOnly(index, nameInput.value); };
  nameField.appendChild(nameLabel);
  nameField.appendChild(nameInput);
  row1.appendChild(nameField);

  const typeField = document.createElement('div');
  const typeLabelEl = document.createElement('label');
  typeLabelEl.textContent = 'Тип этапа';
  const typeSelect = document.createElement('select');
  [RoundType.Question, RoundType.QuestionWithTimer, RoundType.Timer].forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = typeLabel(t);
    if (round.type === t) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.onchange = () => {
    applyTypeChange(round, typeSelect.value);
    markDirty();
    render();
  };
  typeField.appendChild(typeLabelEl);
  typeField.appendChild(typeSelect);
  row1.appendChild(typeField);

  if (round.type !== RoundType.Question) {
    const timerField = document.createElement('div');
    const timerLabel = document.createElement('label');
    timerLabel.textContent = 'Время на этап (секунды)';
    const timerInput = document.createElement('input');
    timerInput.type = 'number';
    timerInput.min = '0';
    timerInput.value = Math.round((round.timer || 0) / 1000);
    timerInput.oninput = () => {
      const seconds = parseInt(timerInput.value, 10) || 0;
      round.timer = seconds * 1000;
      markDirty();
    };
    timerField.appendChild(timerLabel);
    timerField.appendChild(timerInput);
    row1.appendChild(timerField);
  }

  body.appendChild(row1);

  // Questions
  if (round.type !== RoundType.Timer) {
    if (!round.questions) round.questions = [];
    const qLabel = document.createElement('label');
    qLabel.textContent = 'Вопросы';
    body.appendChild(qLabel);

    const list = document.createElement('div');
    list.className = 'questions-list';
    round.questions.forEach((q, qIndex) => {
      list.appendChild(renderQuestionRow(round, qIndex));
    });
    body.appendChild(list);

    const addQBtn = document.createElement('button');
    addQBtn.textContent = '+ Добавить вопрос';
    addQBtn.className = 'small-btn';
    addQBtn.onclick = () => {
      round.questions.push({ text: '' });
      markDirty();
      render();
      state.expanded.add(index);
    };
    body.appendChild(addQBtn);
  }

  return body;
}

function renderNameOnly(index, value) {
  const card = app.querySelector('.round-card[data-index="' + index + '"]');
  if (!card) return;
  const nameEl = card.querySelector('.round-name');
  if (nameEl) nameEl.textContent = value || '(без названия)';
}

let dragQuestionFrom = null;

function renderQuestionRow(round, qIndex) {
  const q = round.questions[qIndex];
  const isImage = !!q.image;

  const row = document.createElement('div');
  row.className = 'question-row';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.draggable = true;
  handle.addEventListener('dragstart', (e) => {
    dragQuestionFrom = qIndex;
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  });
  row.appendChild(handle);

  const main = document.createElement('div');
  main.className = 'question-main';

  const toggle = document.createElement('div');
  toggle.className = 'kind-toggle';
  const textBtn = document.createElement('button');
  textBtn.textContent = 'Текст';
  textBtn.className = isImage ? '' : 'active';
  textBtn.onclick = () => {
    if (q.image) {
      delete q.image;
      markDirty();
    }
    q.text = q.text || '';
    render();
  };
  const imgBtn = document.createElement('button');
  imgBtn.textContent = 'Картинка';
  imgBtn.className = isImage ? 'active' : '';
  imgBtn.onclick = () => pickImageForQuestion(q);
  toggle.appendChild(textBtn);
  toggle.appendChild(imgBtn);
  main.appendChild(toggle);

  if (isImage) {
    main.appendChild(renderImageEditor(q));
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = q.text || '';
    textarea.placeholder = 'Текст вопроса…';
    textarea.oninput = () => { q.text = textarea.value; markDirty(); };
    main.appendChild(textarea);
  }

  row.appendChild(main);

  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const removeBtn = document.createElement('button');
  removeBtn.className = 'danger small-btn';
  removeBtn.textContent = '✕';
  removeBtn.title = 'Удалить вопрос';
  removeBtn.onclick = () => {
    round.questions.splice(qIndex, 1);
    markDirty();
    render();
  };
  actions.appendChild(removeBtn);
  row.appendChild(actions);

  row.addEventListener('dragover', (e) => {
    if (dragQuestionFrom === null) return;
    e.preventDefault();
    e.stopPropagation();
    row.classList.add('drag-over');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    row.classList.remove('drag-over');
    const from = dragQuestionFrom;
    dragQuestionFrom = null;
    if (from === null || from === qIndex) return;
    const [moved] = round.questions.splice(from, 1);
    round.questions.splice(qIndex, 0, moved);
    markDirty();
    render();
  });

  return row;
}

function renderImageEditor(q) {
  const wrap = document.createElement('div');

  if (q.image) {
    const preview = document.createElement('div');
    preview.className = 'image-preview';
    const img = document.createElement('img');
    loadImagePreview(q.image, img);
    preview.appendChild(img);
    const path = document.createElement('div');
    path.className = 'path';
    path.textContent = q.image;
    preview.appendChild(path);
    const changeBtn = document.createElement('button');
    changeBtn.className = 'small-btn';
    changeBtn.textContent = 'Заменить…';
    changeBtn.onclick = () => pickImageForQuestion(q);
    preview.appendChild(changeBtn);
    wrap.appendChild(preview);
    return wrap;
  }

  const drop = document.createElement('div');
  drop.className = 'image-drop';
  drop.textContent = 'Нажмите, чтобы выбрать картинку (откроется папка questions-images)';
  drop.onclick = () => pickImageForQuestion(q);
  wrap.appendChild(drop);
  return wrap;
}

// Opens the OS's own "Open file" dialog (starting in questions-images/) so picking and
// previewing images relies on Windows' own thumbnails instead of a custom in-page gallery.
// The picked file is never copied — only its name is stored, so it must already live in
// questions-images/ for the game to find it.
async function pickImageForQuestion(q) {
  if (!window.showOpenFilePicker) {
    setStatus('Этот браузер не поддерживает выбор файла таким способом.', 'dirty');
    return;
  }
  let handles;
  try {
    handles = await window.showOpenFilePicker({
      id: 'questions-images',
      startIn: state.imagesHandle,
      multiple: false,
      excludeAcceptAllOption: false,
      types: [{
        description: 'Картинки',
        accept: { 'image/*': ['.jpg', '.jpeg', '.png', '.gif', '.webp'] },
      }],
    });
  } catch (e) {
    return; // user cancelled the dialog
  }
  const picked = handles[0];
  q.image = 'assets/questions-images/' + picked.name;
  delete q.text;
  markDirty();
  render();
}

function loadImagePreview(relPath, imgEl) {
  const name = relPath.split('/').pop();
  state.imagesHandle.getFileHandle(name)
    .then((fh) => fh.getFile())
    .then((file) => { imgEl.src = URL.createObjectURL(file); })
    .catch(() => {});
}

// ---------- Wire up header buttons ----------
btnOpen.onclick = pickFolder;
btnSave.onclick = saveRounds;

window.addEventListener('beforeunload', (e) => {
  if (state.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

tryRestore();
</script>
