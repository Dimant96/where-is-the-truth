<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор этапов — where-is-the-truth</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #dde1e6;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0 16px 0 0;
    white-space: nowrap;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
  }
  button:hover { background: #f0f1f5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--danger); }
  button.danger:hover { background: var(--danger-bg); }
  #status {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  #status.dirty { color: #b45309; }
  #status.saved { color: var(--success); }
  main {
    max-width: 760px;
    margin: 24px auto 80px;
    padding: 0 16px;
  }
  .hint {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .error {
    background: var(--danger-bg);
    border: 1px solid #fecaca;
    color: var(--danger);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .round-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .round-card.drag-over { border-color: var(--accent); }
  .round-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .drag-handle {
    cursor: grab;
    color: var(--muted);
    font-size: 18px;
    padding: 2px 4px;
    user-select: none;
  }
  .round-num {
    color: var(--muted);
    font-size: 13px;
    min-width: 20px;
  }
  .round-name {
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge {
    font-size: 12px;
    color: var(--muted);
    background: #f0f1f5;
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .chevron { color: var(--muted); transition: transform .15s; }
  .round-card.expanded .chevron { transform: rotate(90deg); }
  .round-body {
    border-top: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  input[type="text"], input[type="number"], select, textarea {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .field-row > div { flex: 1; min-width: 160px; }
  .questions-list { display: flex; flex-direction: column; gap: 10px; }
  .question-row {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .question-row.drag-over { border-color: var(--accent); }
  .question-main { flex: 1; min-width: 0; }
  .kind-toggle {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .kind-toggle button {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 999px;
  }
  .kind-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .image-drop {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .image-drop.drag-over { border-color: var(--accent); background: #eef2ff; }
  .image-preview {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .image-preview img {
    max-width: 90px;
    max-height: 60px;
    border-radius: 6px;
    border: 1px solid var(--border);
    object-fit: cover;
  }
  .image-preview .path {
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .row-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .small-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  .add-round-btn {
    width: 100%;
    padding: 12px;
    border-style: dashed;
    color: var(--muted);
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>
<header>
  <h1>Редактор этапов</h1>
  <button id="btnOpen">Открыть папку проекта…</button>
  <button id="btnReopen" style="display:none">Открыть ту же папку снова</button>
  <button id="btnSave" class="primary" disabled>Сохранить</button>
  <span id="status"></span>
</header>
<main id="app">
  <div class="hint">
    Нажмите «Открыть папку проекта» и выберите папку <b>where-is-the-truth</b> на своём компьютере.
    Работает только в <b>Chrome</b> или <b>Edge</b>.
  </div>
</main>

<script>
'use strict';

const RoundType = {
  Question: 'Question',
  QuestionWithTimer: 'Question with timer',
  Timer: 'Timer',
};

const state = {
  rootHandle: null,
  imagesHandle: null,
  roundsHandle: null,
  rounds: null,
  expanded: new Set(),
  dirty: false,
  dragRoundFrom: null,
};

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const btnOpen = document.getElementById('btnOpen');
const btnReopen = document.getElementById('btnReopen');
const btnSave = document.getElementById('btnSave');

// ---------- IndexedDB (remembers the last picked folder so we don't ask every time) ----------
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rounds-editor', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

// ---------- Status / error helpers ----------
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}
function markDirty() {
  state.dirty = true;
  btnSave.disabled = false;
  setStatus('Есть несохранённые изменения', 'dirty');
}
function markSaved() {
  state.dirty = false;
  btnSave.disabled = true;
  setStatus('Сохранено', 'saved');
}
function showError(message) {
  app.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------- Opening the project folder ----------
async function pickFolder() {
  if (!window.showDirectoryPicker) {
    showError('Этот браузер не поддерживает прямой доступ к файлам.\nОткройте этот файл в Chrome или Edge.');
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    return; // user cancelled the picker
  }
  await idbSet('root', handle);
  await loadFromRoot(handle);
}

async function tryRestore() {
  let handle;
  try {
    handle = await idbGet('root');
  } catch (e) {
    return;
  }
  if (!handle) return;
  const perm = await handle.queryPermission({ mode: 'readwrite' }).catch(() => 'prompt');
  if (perm === 'granted') {
    loadFromRoot(handle);
  } else {
    btnReopen.style.display = '';
    btnReopen.onclick = async () => {
      const p = await handle.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
      if (p === 'granted') {
        btnReopen.style.display = 'none';
        loadFromRoot(handle);
      } else {
        setStatus('Доступ не предоставлен', 'dirty');
      }
    };
  }
}

async function loadFromRoot(rootHandle) {
  setStatus('Загрузка…');
  try {
    const srcHandle = await rootHandle.getDirectoryHandle('src');
    const assetsHandle = await srcHandle.getDirectoryHandle('assets');
    const roundsHandle = await assetsHandle.getFileHandle('rounds.json');
    const imagesHandle = await assetsHandle.getDirectoryHandle('questions-images');
    const file = await roundsHandle.getFile();
    const text = await file.text();
    let rounds;
    try {
      rounds = JSON.parse(text);
    } catch (e) {
      showError('Не удалось прочитать rounds.json — файл повреждён или содержит не-JSON данные.');
      return;
    }
    state.rootHandle = rootHandle;
    state.roundsHandle = roundsHandle;
    state.imagesHandle = imagesHandle;
    state.rounds = rounds;
    state.expanded = new Set();
    state.dirty = false;
    btnSave.disabled = true;
    setStatus('Открыто: ' + rootHandle.name);
    render();
  } catch (e) {
    showError(
      'В выбранной папке не найден src/assets/rounds.json.\n' +
      'Убедитесь, что вы выбрали именно папку "where-is-the-truth" (а не вложенную/родительскую папку).\n\n' +
      'Техническая причина: ' + e.message
    );
  }
}

// ---------- Saving ----------
async function saveRounds() {
  if (!state.roundsHandle) return;
  // Any image picked but not yet explicitly confirmed (via "Добавить картинку") must still
  // end up in the saved file — otherwise a forgotten confirm click silently loses the pick.
  if (pendingImageFiles.size > 0) {
    setStatus('Сохранение картинок…');
    for (const q of Array.from(pendingImageFiles.keys())) {
      await confirmPendingImage(q);
    }
  }
  setStatus('Сохранение…');
  try {
    const writable = await state.roundsHandle.createWritable();
    await writable.write(JSON.stringify(state.rounds, null, 2) + '\n');
    await writable.close();
    markSaved();
  } catch (e) {
    setStatus('Ошибка сохранения: ' + e.message, 'dirty');
  }
}

// ---------- Image files ----------
async function writeImageFile(file) {
  const dir = state.imagesHandle;
  let name = file.name;
  const dot = name.lastIndexOf('.');
  const base = dot > -1 ? name.slice(0, dot) : name;
  const ext = dot > -1 ? name.slice(dot) : '';
  let exists = await dir.getFileHandle(name).then(() => true).catch(() => false);
  if (exists) {
    let i = 1;
    let candidate;
    do {
      candidate = base + '-' + i + ext;
      exists = await dir.getFileHandle(candidate).then(() => true).catch(() => false);
      i++;
    } while (exists);
    name = candidate;
    setStatus('Файл с таким именем уже был — сохранено как "' + name + '"', 'dirty');
  }
  const fh = await dir.getFileHandle(name, { create: true });
  const writable = await fh.createWritable();
  await writable.write(file);
  await writable.close();
  return name;
}

// ---------- Round / question data helpers ----------
function newRound() {
  return { type: RoundType.Question, name: 'Новый этап', questions: [{ text: '' }] };
}
function applyTypeChange(round, type) {
  round.type = type;
  if (type === RoundType.Timer) {
    delete round.questions;
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else if (type === RoundType.QuestionWithTimer) {
    if (!round.questions) round.questions = [{ text: '' }];
    if (typeof round.timer !== 'number') round.timer = 30000;
  } else {
    if (!round.questions) round.questions = [{ text: '' }];
    delete round.timer;
  }
}

// ---------- Rendering ----------
function render() {
  if (!state.rounds) return;
  app.innerHTML = '';

  if (state.rounds.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Этапов пока нет.';
    app.appendChild(empty);
  }

  state.rounds.forEach((round, index) => {
    app.appendChild(renderRoundCard(round, index));
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-round-btn';
  addBtn.textContent = '+ Добавить этап';
  addBtn.onclick = () => {
    state.rounds.push(newRound());
    state.expanded.add(state.rounds.length - 1);
    markDirty();
    render();
  };
  app.appendChild(addBtn);
}

function renderRoundCard(round, index) {
  const card = document.createElement('div');
  card.className = 'round-card' + (state.expanded.has(index) ? ' expanded' : '');
  card.dataset.index = String(index);

  const head = document.createElement('div');
  head.className = 'round-head';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.draggable = true;
  handle.title = 'Перетащите, чтобы изменить порядок';
  handle.addEventListener('dragstart', (e) => {
    state.dragRoundFrom = index;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(index));
  });
  head.appendChild(handle);

  const num = document.createElement('span');
  num.className = 'round-num';
  num.textContent = (index + 1) + '.';
  head.appendChild(num);

  const name = document.createElement('span');
  name.className = 'round-name';
  name.textContent = round.name || '(без названия)';
  head.appendChild(name);

  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = typeLabel(round.type);
  head.appendChild(badge);

  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.textContent = '›';
  head.appendChild(chevron);

  head.addEventListener('click', () => {
    if (state.expanded.has(index)) state.expanded.delete(index);
    else state.expanded.add(index);
    render();
  });
  card.appendChild(head);

  card.addEventListener('dragover', (e) => {
    if (state.dragRoundFrom === null) return;
    e.preventDefault();
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const from = state.dragRoundFrom;
    state.dragRoundFrom = null;
    if (from === null || from === index) return;
    const [moved] = state.rounds.splice(from, 1);
    state.rounds.splice(index, 0, moved);
    markDirty();
    render();
  });

  if (state.expanded.has(index)) {
    card.appendChild(renderRoundBody(round, index));
  }

  return card;
}

function typeLabel(type) {
  if (type === RoundType.Question) return 'Вопросы';
  if (type === RoundType.QuestionWithTimer) return 'Вопросы + таймер';
  if (type === RoundType.Timer) return 'Таймер';
  return type;
}

function renderRoundBody(round, index) {
  const body = document.createElement('div');
  body.className = 'round-body';
  body.addEventListener('click', (e) => e.stopPropagation());

  // Name + type row
  const row1 = document.createElement('div');
  row1.className = 'field-row';

  const nameField = document.createElement('div');
  const nameLabel = document.createElement('label');
  nameLabel.textContent = 'Название этапа';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.value = round.name || '';
  nameInput.oninput = () => { round.name = nameInput.value; markDirty(); renderNameOnly(index, nameInput.value); };
  nameField.appendChild(nameLabel);
  nameField.appendChild(nameInput);
  row1.appendChild(nameField);

  const typeField = document.createElement('div');
  const typeLabelEl = document.createElement('label');
  typeLabelEl.textContent = 'Тип этапа';
  const typeSelect = document.createElement('select');
  [RoundType.Question, RoundType.QuestionWithTimer, RoundType.Timer].forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = typeLabel(t);
    if (round.type === t) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.onchange = () => {
    applyTypeChange(round, typeSelect.value);
    markDirty();
    render();
  };
  typeField.appendChild(typeLabelEl);
  typeField.appendChild(typeSelect);
  row1.appendChild(typeField);

  if (round.type !== RoundType.Question) {
    const timerField = document.createElement('div');
    const timerLabel = document.createElement('label');
    timerLabel.textContent = 'Время на этап (секунды)';
    const timerInput = document.createElement('input');
    timerInput.type = 'number';
    timerInput.min = '0';
    timerInput.value = Math.round((round.timer || 0) / 1000);
    timerInput.oninput = () => {
      const seconds = parseInt(timerInput.value, 10) || 0;
      round.timer = seconds * 1000;
      markDirty();
    };
    timerField.appendChild(timerLabel);
    timerField.appendChild(timerInput);
    row1.appendChild(timerField);
  }

  body.appendChild(row1);

  // Questions
  if (round.type !== RoundType.Timer) {
    if (!round.questions) round.questions = [];
    const qLabel = document.createElement('label');
    qLabel.textContent = 'Вопросы';
    body.appendChild(qLabel);

    const list = document.createElement('div');
    list.className = 'questions-list';
    round.questions.forEach((q, qIndex) => {
      list.appendChild(renderQuestionRow(round, qIndex));
    });
    body.appendChild(list);

    const addQBtn = document.createElement('button');
    addQBtn.textContent = '+ Добавить вопрос';
    addQBtn.className = 'small-btn';
    addQBtn.onclick = () => {
      round.questions.push({ text: '' });
      markDirty();
      render();
      state.expanded.add(index);
    };
    body.appendChild(addQBtn);
  }

  // Footer: delete round
  const footer = document.createElement('div');
  footer.className = 'card-footer';
  const delBtn = document.createElement('button');
  delBtn.className = 'danger small-btn';
  delBtn.textContent = 'Удалить этап';
  delBtn.onclick = () => {
    if (!confirm('Удалить этап "' + (round.name || '') + '"?')) return;
    state.rounds.splice(index, 1);
    state.expanded.delete(index);
    markDirty();
    render();
  };
  footer.appendChild(document.createElement('span'));
  footer.appendChild(delBtn);
  body.appendChild(footer);

  return body;
}

function renderNameOnly(index, value) {
  const card = app.querySelector('.round-card[data-index="' + index + '"]');
  if (!card) return;
  const nameEl = card.querySelector('.round-name');
  if (nameEl) nameEl.textContent = value || '(без названия)';
}

let dragQuestionFrom = null;
// Questions are still text/image in memory while the user is mid-pick, before rounds.json
// is written — tracked here rather than on the question object so a cancelled pick can't
// leave a question with neither text nor image saved to disk.
// Regular Set/Map (not Weak) so saveRounds() can iterate pending picks before writing.
const imageMode = new Set();
const pendingImageFiles = new Map();

function renderQuestionRow(round, qIndex) {
  const q = round.questions[qIndex];
  const isImage = !!q.image || imageMode.has(q);

  const row = document.createElement('div');
  row.className = 'question-row';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.draggable = true;
  handle.addEventListener('dragstart', (e) => {
    dragQuestionFrom = qIndex;
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  });
  row.appendChild(handle);

  const main = document.createElement('div');
  main.className = 'question-main';

  const toggle = document.createElement('div');
  toggle.className = 'kind-toggle';
  const textBtn = document.createElement('button');
  textBtn.textContent = 'Текст';
  textBtn.className = isImage ? '' : 'active';
  textBtn.onclick = () => {
    imageMode.delete(q);
    pendingImageFiles.delete(q);
    if (q.image) {
      delete q.image;
      markDirty();
    }
    q.text = q.text || '';
    render();
  };
  const imgBtn = document.createElement('button');
  imgBtn.textContent = 'Картинка';
  imgBtn.className = isImage ? 'active' : '';
  imgBtn.onclick = () => {
    imageMode.add(q);
    render();
    triggerFilePick(q);
  };
  toggle.appendChild(textBtn);
  toggle.appendChild(imgBtn);
  main.appendChild(toggle);

  if (isImage) {
    main.appendChild(renderImageEditor(q));
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = q.text || '';
    textarea.placeholder = 'Текст вопроса…';
    textarea.oninput = () => { q.text = textarea.value; markDirty(); };
    main.appendChild(textarea);
  }

  row.appendChild(main);

  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const removeBtn = document.createElement('button');
  removeBtn.className = 'danger small-btn';
  removeBtn.textContent = '✕';
  removeBtn.title = 'Удалить вопрос';
  removeBtn.onclick = () => {
    imageMode.delete(q);
    pendingImageFiles.delete(q);
    round.questions.splice(qIndex, 1);
    markDirty();
    render();
  };
  actions.appendChild(removeBtn);
  row.appendChild(actions);

  row.addEventListener('dragover', (e) => {
    if (dragQuestionFrom === null) return;
    e.preventDefault();
    e.stopPropagation();
    row.classList.add('drag-over');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    row.classList.remove('drag-over');
    const from = dragQuestionFrom;
    dragQuestionFrom = null;
    if (from === null || from === qIndex) return;
    const [moved] = round.questions.splice(from, 1);
    round.questions.splice(qIndex, 0, moved);
    markDirty();
    render();
  });

  return row;
}

function renderImageEditor(q) {
  const wrap = document.createElement('div');
  const pendingFile = pendingImageFiles.get(q);

  // A freshly picked file waiting for explicit confirmation — nothing is written to
  // disk and q.image isn't set until the user clicks "Добавить картинку".
  if (pendingFile) {
    const preview = document.createElement('div');
    preview.className = 'image-preview';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(pendingFile);
    preview.appendChild(img);
    const path = document.createElement('div');
    path.className = 'path';
    path.textContent = pendingFile.name + ' — ещё не сохранено';
    preview.appendChild(path);
    wrap.appendChild(preview);

    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '8px';
    actions.style.marginTop = '8px';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'primary small-btn';
    confirmBtn.textContent = 'Добавить картинку';
    confirmBtn.onclick = () => confirmPendingImage(q);
    actions.appendChild(confirmBtn);
    const changeBtn = document.createElement('button');
    changeBtn.className = 'small-btn';
    changeBtn.textContent = 'Выбрать другой файл';
    changeBtn.onclick = () => triggerFilePick(q);
    actions.appendChild(changeBtn);
    wrap.appendChild(actions);
    return wrap;
  }

  if (q.image) {
    const preview = document.createElement('div');
    preview.className = 'image-preview';
    const img = document.createElement('img');
    loadImagePreview(q.image, img);
    preview.appendChild(img);
    const path = document.createElement('div');
    path.className = 'path';
    path.textContent = q.image;
    preview.appendChild(path);
    const changeBtn = document.createElement('button');
    changeBtn.className = 'small-btn';
    changeBtn.textContent = 'Заменить…';
    changeBtn.onclick = () => triggerFilePick(q);
    preview.appendChild(changeBtn);
    wrap.appendChild(preview);
    return wrap;
  }

  const drop = document.createElement('div');
  drop.className = 'image-drop';
  drop.textContent = 'Перетащите картинку сюда или нажмите, чтобы выбрать файл';
  drop.onclick = () => triggerFilePick(q);
  drop.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    drop.classList.remove('drag-over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) setPendingImage(q, file);
  });
  wrap.appendChild(drop);
  return wrap;
}

function triggerFilePick(q) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (file) setPendingImage(q, file);
  };
  input.click();
}

function setPendingImage(q, file) {
  imageMode.add(q);
  pendingImageFiles.set(q, file);
  render();
}

async function confirmPendingImage(q) {
  const file = pendingImageFiles.get(q);
  if (!file) return;
  setStatus('Копирование картинки…');
  try {
    const finalName = await writeImageFile(file);
    q.image = 'assets/questions-images/' + finalName;
    delete q.text;
    pendingImageFiles.delete(q);
    imageMode.delete(q);
    markDirty();
    render();
  } catch (e) {
    setStatus('Не удалось сохранить картинку: ' + e.message, 'dirty');
  }
}

function loadImagePreview(relPath, imgEl) {
  const name = relPath.split('/').pop();
  state.imagesHandle.getFileHandle(name)
    .then((fh) => fh.getFile())
    .then((file) => { imgEl.src = URL.createObjectURL(file); })
    .catch(() => {});
}

// ---------- Wire up header buttons ----------
btnOpen.onclick = pickFolder;
btnSave.onclick = saveRounds;

window.addEventListener('beforeunload', (e) => {
  if (state.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

tryRestore();
</script>
</body>
