<ng-container *ngIf="(teams$ | async) as teams">
    <div class="teams__names">
        <h1 *ngFor="let team of teams">
            {{team.name}}
        </h1>
    </div>
    <div
        *ngIf="(round$ | async) as round"
        class="content-wrapper"
    >
        <ng-container
            [ngSwitch]="round.type"
        >
            <common-question
                *ngSwitchCase="questionRound"
                [question]="round.questions[questionNumber$ | async]"
            ></common-question>
            <question-with-timer
                *ngSwitchCase="questionWithTimerRound"
                [question]="round.questions[questionNumber$ | async]"
                [timer]="timer$ | async"
            ></question-with-timer>
            <timer
                *ngSwitchCase="timerRound"
                [question]="round.questions[questionNumber$ | async]"
                [timer]="timer$ | async"
            ></timer>
        </ng-container>
    </div>
    <div class="teams__score">
        <h2 *ngFor="let team of teams" (click)="nextQuestion()">
            {{team.score}}
        </h2>
    </div>
</ng-container>
